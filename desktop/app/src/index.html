<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>Phone11 desktop trial</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><div class="brand">Phone11</div><span class="tag">DESKTOP TRIAL</span></header>
<section class="trial"><strong>60-second trial calls</strong><p>Official Siprix trial. Calls may end after 60 seconds.</p></section>
<p id="message" role="status" aria-live="polite"></p>
<section id="login"><h1>Sign in</h1><p>Use your Phone11 account to connect your extension.</p><form id="login-form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form></section>
<section id="phone" hidden><div class="row"><div><p id="identity" class="small"></p><h1 id="status">Connecting</h1></div><button id="sign-out" class="text" type="button">Sign out</button></div><p id="call-id" class="small">No active call</p><p id="notice" class="small"></p><form id="dial-form" class="row"><input id="destination" aria-label="Number or extension" inputmode="tel" placeholder="Number or extension" pattern="[+0-9*#]{1,32}" required><button id="dial" type="submit">Call</button></form><div class="controls"><button id="answer" type="button" hidden>Answer</button><button id="end" type="button" hidden>End</button><button id="mute" type="button" hidden>Mute</button><button id="hold" type="button" hidden>Hold</button></div><p id="hold-message" role="status"></p><div id="keypad" class="keypad" hidden><button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button data-digit="*">*</button><button data-digit="0">0</button><button data-digit="#">#</button></div></section></main><script src="renderer.js"></script></body></html>

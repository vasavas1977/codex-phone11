name: Build & Push Docker Images

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Service to build. Use backend for the Phone11 API.'
        required: false
        default: 'backend'
      platform:
        description: 'Choose the architecture after checking the serving host topology.'
        required: true
        type: choice
        default: 'linux/amd64'
        options:
          - linux/amd64
      publish:
        description: 'Push to the existing ECR repository. Disable for a local build check.'
        required: true
        type: boolean
        default: true
      diagnose_start:
        description: 'Build-only fixed-start diagnostics. Public output is finite; raw fields stay runner-private.'
        required: true
        type: boolean
        default: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

permissions:
  id-token: write
  contents: read

jobs:
  build-backend:
    if: inputs.services == 'backend' || inputs.services == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the selected native builder platform
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: test "$SELECTED_PLATFORM" = linux/amd64 && test "$(uname -m)" = x86_64

      - name: Refuse publishing in diagnostic mode
        if: inputs.diagnose_start && inputs.publish
        run: echo 'diagnose_start requires publish=false' >&2; exit 1

      - name: Validate AWS region
        if: inputs.publish
        run: test -n "$AWS_REGION" || { echo 'AWS_REGION variable is required'; exit 1; }

      - name: Configure AWS credentials
        if: inputs.publish
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: inputs.publish
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Require the existing backend repository
        if: inputs.publish
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names cloudphone11/backend --region "$AWS_REGION" --query 'repositories[0].repositoryName' --output text | grep -Fx cloudphone11/backend

      - name: Prepare exact tracked public backend context
        run: python3 -I -B scripts/prepare-phone11-backend-context.py --prepare "$RUNNER_TEMP/phone11-backend-context"

      - name: Build and push Backend
        if: inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/phone11-backend-context
          file: ${{ runner.temp }}/phone11-backend-context/infra/docker/backend/Dockerfile
          platforms: ${{ inputs.platform }}
          build-args: |
            PHONE11_BUILD_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/cloudphone11/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Backend locally without publishing
        if: ${{ !inputs.publish }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/phone11-backend-context
          file: ${{ runner.temp }}/phone11-backend-context/infra/docker/backend/Dockerfile
          platforms: ${{ inputs.platform }}
          build-args: |
            PHONE11_BUILD_SHA=${{ github.sha }}
          push: false
          load: true
          tags: phone11-backend-check:${{ github.sha }}

      - name: Record finite local image metadata
        if: ${{ !inputs.publish }}
        run: python3 -I -B scripts/describe-phone11-backend-image.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/phone11-backend-build.json"

      - name: Keep local build metadata
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: phone11-backend-build-${{ github.sha }}
          path: ${{ runner.temp }}/phone11-backend-build.json
          if-no-files-found: error
          retention-days: 1

      - name: Smoke the isolated backend process
        if: ${{ !inputs.publish }}
        timeout-minutes: 3
        env:
          DIAGNOSE_START: ${{ inputs.diagnose_start }}
        run: |
          if [ "$DIAGNOSE_START" = true ]; then
            python3 -I -B scripts/smoke-phone11-backend-image.py --diagnose-start --commit "$GITHUB_SHA" --metadata "$RUNNER_TEMP/phone11-backend-build.json" --output "$RUNNER_TEMP/phone11-backend-smoke.json" --private-diagnostics "$RUNNER_TEMP/phone11-backend-smoke-private.log"
          else
            python3 -I -B scripts/smoke-phone11-backend-image.py --commit "$GITHUB_SHA" --metadata "$RUNNER_TEMP/phone11-backend-build.json" --output "$RUNNER_TEMP/phone11-backend-smoke.json" --private-diagnostics "$RUNNER_TEMP/phone11-backend-smoke-private.log"
          fi

      - name: Keep finite process smoke evidence
        if: ${{ always() && !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: phone11-backend-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/phone11-backend-smoke.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Keep protected fixed-start diagnostics only in a private repository
        if: ${{ always() && !inputs.publish && inputs.diagnose_start && github.event.repository.private == true }}
        uses: actions/upload-artifact@v4
        with:
          name: phone11-backend-start-private-${{ github.sha }}
          path: ${{ runner.temp }}/phone11-backend-smoke-private.log
          if-no-files-found: ignore
          retention-days: 1

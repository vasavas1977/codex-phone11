name: Build & Push Docker Images

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Service to build. Use backend for the Phone11 API.'
        required: false
        default: 'backend'

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

permissions:
  id-token: write
  contents: read

jobs:
  build-backend:
    if: inputs.services == 'backend' || inputs.services == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate AWS region
        run: test -n "$AWS_REGION" || { echo 'AWS_REGION variable is required'; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/cloudphone11/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

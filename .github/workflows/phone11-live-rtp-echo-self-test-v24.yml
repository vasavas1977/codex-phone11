name: Phone11 Live RTP Echo Self Test V24

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - ".github/workflows/phone11-live-rtp-echo-self-test-v24.yml"
  workflow_dispatch:
    inputs:
      ec2_host:
        description: Live SIP/media EC2 host
        required: true
        default: 43.210.122.111

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_USER: ubuntu
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  SIP_DOMAIN: sip.phone11.ai
  SIP_SERVER: 43.210.122.111
  TEST_EXTENSION: "1998"
  TEST_PASSWORD: phone11-v24-external-runner
  TEST_TARGET: "*9196"

jobs:
  rtp-echo-self-test:
    name: Prove external SIP plus RTP echo after FreeSWITCH auth fix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Locate EC2 and prepare temporary SSH key
        id: ec2
        shell: bash
        run: |
          set -Eeuo pipefail
          EC2_HOST="${{ github.event.inputs.ec2_host || '43.210.122.111' }}"
          INSTANCE_JSON=$(aws ec2 describe-instances --filters "Name=ip-address,Values=$EC2_HOST" "Name=instance-state-name,Values=running" --query 'Reservations[0].Instances[0]' --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "null" ]; then echo "ERROR: EC2 not found"; exit 31; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/phone11_rtp_echo_v24_key -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key --instance-id "$INSTANCE_ID" --availability-zone "$AZ" --instance-os-user "$EC2_USER" --ssh-public-key "file://$HOME/.ssh/phone11_rtp_echo_v24_key.pub" >/dev/null
          echo "ec2_host=$EC2_HOST" >> "$GITHUB_OUTPUT"

      - name: Prepare trusted FreeSWITCH echo target and subscriber
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/phone11_rtp_echo_v24_key -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 "$EC2_USER@${{ steps.ec2.outputs.ec2_host }}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          DOMAIN="sip.phone11.ai"
          TEST_EXTENSION="1998"
          TEST_PASSWORD="phone11-v24-external-runner"
          PGUSER="$(docker exec cp11-postgres sh -lc 'printf %s "${POSTGRES_USER:-postgres}"')"
          PGDATABASE="$(docker exec cp11-postgres sh -lc 'printf %s "${POSTGRES_DB:-${POSTGRES_USER:-postgres}}"')"
          PGPASSWORD_VALUE="$(docker exec cp11-postgres sh -lc 'printf %s "${POSTGRES_PASSWORD:-}"')"

          echo "===== FreeSWITCH Sofia status before patch ====="
          docker exec p11-freeswitch fs_cli -x "sofia status" | sed -n '1,180p' || true
          docker exec p11-freeswitch sh -lc 'grep -RIn "sip-port\\|auth-calls\\|apply-inbound-acl\\|context\\|ext-rtp-ip\\|ext-sip-ip" /etc/freeswitch/sip_profiles/*.xml /etc/freeswitch/sip_profiles/*/*.xml 2>/dev/null | sed -n "1,220p"' || true

          echo "===== Patch external profile so trusted Kamailio leg is not challenged ====="
          BACKUP="/tmp/external.xml.phone11-v24.bak.$(date +%s)"
          docker cp p11-freeswitch:/etc/freeswitch/sip_profiles/external.xml "$BACKUP"
          cp "$BACKUP" /tmp/external.xml.phone11-v24.edit
          python3 - <<'PY'
          from pathlib import Path
          import re
          profile = Path("/tmp/external.xml.phone11-v24.edit")
          text = profile.read_text()
          lines = text.splitlines()
          out = []
          replaced = False
          for line in lines:
              if not replaced and re.match(r"\s*<param\s+name=\"auth-calls\"", line) and not re.match(r"\s*<!--", line):
                  indent = re.match(r"^(\s*)", line).group(1)
                  out.append(f'{indent}<param name="auth-calls" value="false"/>')
                  replaced = True
              else:
                  out.append(line)
          if not replaced:
              for i, line in enumerate(out):
                  if re.match(r"\s*<settings>\s*$", line):
                      indent = re.match(r"^(\s*)", line).group(1) + "  "
                      out.insert(i + 1, f'{indent}<param name="auth-calls" value="false"/>')
                      replaced = True
                      break
          if not replaced:
              raise SystemExit("external.xml has no active auth-calls line and no <settings> block")
          profile.write_text("\n".join(out) + "\n")
          print("FREESWITCH_EXTERNAL_AUTH_CALLS_FALSE=applied")
          PY
          docker cp /tmp/external.xml.phone11-v24.edit p11-freeswitch:/etc/freeswitch/sip_profiles/external.xml
          echo "external_profile_backup=$BACKUP"
          docker exec p11-freeswitch sh -lc 'grep -n "auth-calls\\|sip-port\\|context\\|ext-rtp-ip\\|ext-sip-ip" /etc/freeswitch/sip_profiles/external.xml | sed -n "1,120p"'
          docker exec p11-freeswitch fs_cli -x reloadxml
          docker exec p11-freeswitch fs_cli -x "sofia profile external restart reloadxml" || docker exec p11-freeswitch fs_cli -x "sofia profile external restart"
          sleep 5
          docker exec p11-freeswitch fs_cli -x "sofia status profile external" | grep -E "Name|Domain Name|URL|BIND-URL|RUNNING|Port|Auth|RTP-IP|SIP-IP" | sed -n '1,160p' || true

          echo "===== Write high-priority FreeSWITCH echo test dialplan ====="
          docker exec -i p11-freeswitch sh -lc 'cat > /etc/freeswitch/dialplan/public/00_phone11_media_self_test.xml' <<'XML'
          <include>
            <extension name="phone11_media_echo_star_9196">
              <condition field="destination_number" expression="^\*9196$" break="on-true">
                <action application="set" data="phone11_media_self_test=true"/>
                <action application="answer"/>
                <action application="echo"/>
              </condition>
            </extension>
          </include>
          XML
          docker exec -i p11-freeswitch sh -lc 'cat > /etc/freeswitch/dialplan/default/00_phone11_media_self_test.xml' <<'XML'
          <include>
            <extension name="phone11_media_echo_star_9196">
              <condition field="destination_number" expression="^\*9196$" break="on-true">
                <action application="set" data="phone11_media_self_test=true"/>
                <action application="answer"/>
                <action application="echo"/>
              </condition>
            </extension>
          </include>
          XML
          docker exec p11-freeswitch fs_cli -x reloadxml
          docker exec p11-freeswitch sh -lc 'grep -RIn "\*9196\\|phone11_media_echo\\|phone11_media_self_test" /etc/freeswitch/dialplan/public/00_phone11_media_self_test.xml /etc/freeswitch/dialplan/default/00_phone11_media_self_test.xml /etc/freeswitch/dialplan/public/99_phone11_media_self_test.xml /etc/freeswitch/dialplan/default/99_phone11_media_self_test.xml 2>/dev/null || true'
          echo "SERVER_LOG_MARKER_EPOCH=$(date +%s)"

          echo "===== Upsert external self-test subscriber ====="
          docker exec -i -e PGPASSWORD="$PGPASSWORD_VALUE" cp11-postgres psql -v ON_ERROR_STOP=1 -U "$PGUSER" -d "$PGDATABASE" <<SQL
          INSERT INTO subscriber (username, domain, password, ha1, ha1b)
          VALUES ('$TEST_EXTENSION', '$DOMAIN', '$TEST_PASSWORD', md5('$TEST_EXTENSION:$DOMAIN:$TEST_PASSWORD'), md5('$TEST_EXTENSION@$DOMAIN:$DOMAIN:$TEST_PASSWORD'))
          ON CONFLICT (username, domain) DO UPDATE SET password = EXCLUDED.password, ha1 = EXCLUDED.ha1, ha1b = EXCLUDED.ha1b;
          SELECT username, domain, length(ha1) AS ha1_len FROM subscriber WHERE username = '$TEST_EXTENSION' AND domain = '$DOMAIN';
          SQL

          echo "===== Start short server packet capture ====="
          rm -f /tmp/phone11-v24-media.pcap.txt
          if command -v tcpdump >/dev/null 2>&1; then
            sudo sh -lc 'nohup timeout 95 tcpdump -i any -nn -s0 -A "(udp port 5060) or (udp portrange 20000-20150)" > /tmp/phone11-v24-media.pcap.txt 2>&1 &' || true
            sleep 2
          else
            echo "tcpdump_missing=yes" | sudo tee /tmp/phone11-v24-media.pcap.txt >/dev/null
          fi
          echo "SERVER_PREP_RESULT=pass"
          REMOTE

      - name: Run external SIP and RTP echo self-test
        id: rtp
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee /tmp/phone11-v24-rtp-test.log
          import hashlib, os, random, re, secrets, select, socket, struct, sys, time

          DOMAIN=os.environ["SIP_DOMAIN"]
          SERVER=(os.environ["SIP_SERVER"], 5060)
          USER=os.environ["TEST_EXTENSION"]
          PASSWORD=os.environ["TEST_PASSWORD"]
          TARGET=os.environ["TEST_TARGET"]

          def md5(v): return hashlib.md5(v.encode()).hexdigest()
          def header(text,name):
              m=re.search(rf'^{re.escape(name)}:\s*(.+)$', text, re.I|re.M)
              return m.group(1).strip() if m else ""
          def status_code(text):
              first=text.splitlines()[0] if text.splitlines() else ""
              m=re.match(r'SIP/2.0\s+(\d+)', first)
              return int(m.group(1)) if m else 0
          def body(text):
              return text.split("\r\n\r\n", 1)[1] if "\r\n\r\n" in text else ""
          def parse_auth(value):
              value=value.replace("Digest","",1).strip()
              return {k.lower():(q or b) for k,q,b in re.findall(r'(\w+)=(?:"([^"]*)"|([^,\s]+))', value)}
          def digest_value(username,password,challenge,method,uri):
              d=parse_auth(challenge)
              realm=d.get("realm", DOMAIN)
              nonce=d["nonce"]
              qop="auth" if "auth" in d.get("qop","") else ""
              cnonce=secrets.token_hex(8)
              nc="00000001"
              ha1=md5(f"{username}:{realm}:{password}")
              ha2=md5(f"{method}:{uri}")
              resp=md5(f"{ha1}:{nonce}:{nc}:{cnonce}:{qop}:{ha2}") if qop else md5(f"{ha1}:{nonce}:{ha2}")
              parts=[f'username="{username}"', f'realm="{realm}"', f'nonce="{nonce}"', f'uri="{uri}"', f'response="{resp}"', "algorithm=MD5"]
              if d.get("opaque"): parts.append(f'opaque="{d["opaque"]}"')
              if qop: parts.extend([f"qop={qop}", f"nc={nc}", f'cnonce="{cnonce}"'])
              return "Digest " + ", ".join(parts)
          def local_ip_for_server():
              s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              try:
                  s.connect(SERVER)
                  return s.getsockname()[0]
              finally:
                  s.close()
          def parse_sdp_media(sdp):
              ip=""
              port=0
              for line in sdp.splitlines():
                  if line.startswith("c=IN IP4 "):
                      ip=line.split()[-1].strip()
                  if line.startswith("m=audio "):
                      port=int(line.split()[1])
              return ip, port
          def rtp_packet(seq, ts, ssrc, payload_byte):
              return struct.pack("!BBHII", 0x80, 0x00, seq & 0xffff, ts & 0xffffffff, ssrc) + bytes([payload_byte]) * 160

          local_ip=local_ip_for_server()
          sip=socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sip.bind(("0.0.0.0", random.randint(24000, 24999)))
          sip.setblocking(False)
          sip_port=sip.getsockname()[1]
          rtp=socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          rtp.bind(("0.0.0.0", random.randrange(30000, 31998, 2)))
          rtp.setblocking(False)
          rtp_port=rtp.getsockname()[1]
          contact=f"<sip:{USER}@{local_ip}:{sip_port};transport=udp>"

          def send_sip(payload):
              sip.sendto(payload.encode(), SERVER)
          def recv_call(call_id, timeout):
              deadline=time.time()+timeout
              while time.time()<deadline:
                  ready,_,_=select.select([sip], [], [], 0.2)
                  if not ready:
                      continue
                  data,addr=sip.recvfrom(65535)
                  text=data.decode(errors="replace")
                  if call_id in text:
                      return text, addr
              raise TimeoutError(f"no SIP response for {call_id}")
          def register():
              uri=f"sip:{DOMAIN}"
              call_id=f"phone11-v24-register-{secrets.token_hex(8)}@runner"
              tag=secrets.token_hex(5)
              def msg(cseq, auth_header=""):
                  branch=f"z9hG4bKv24reg{secrets.token_hex(8)}{cseq}"
                  lines=[
                      f"REGISTER {uri} SIP/2.0",
                      f"Via: SIP/2.0/UDP {local_ip}:{sip_port};branch={branch};rport",
                      "Max-Forwards: 70",
                      f"From: <sip:{USER}@{DOMAIN}>;tag={tag}",
                      f"To: <sip:{USER}@{DOMAIN}>",
                      f"Call-ID: {call_id}",
                      f"CSeq: {cseq} REGISTER",
                      f"Contact: {contact};expires=300",
                      "Expires: 300",
                      "User-Agent: Phone11RtpEchoSelfTest/24",
                  ]
                  if auth_header:
                      lines.append(auth_header)
                  lines += ["Content-Length: 0", "", ""]
                  return "\r\n".join(lines)
              send_sip(msg(1))
              first,_=recv_call(call_id, 10)
              code=status_code(first)
              if code in (401,407):
                  challenge=header(first,"WWW-Authenticate") or header(first,"Proxy-Authenticate")
                  name="Proxy-Authorization" if code == 407 else "Authorization"
                  send_sip(msg(2, f"{name}: {digest_value(USER, PASSWORD, challenge, 'REGISTER', uri)}"))
                  final,_=recv_call(call_id, 10)
                  code=status_code(final)
              print(f"registration_status={code}")
              if code != 200:
                  raise RuntimeError(f"registration failed status={code}")
          def invite():
              call_id=f"phone11-v24-rtp-echo-{secrets.token_hex(8)}@runner"
              print(f"call_id={call_id}")
              print(f"::notice title=Phone11 V24 Call-ID::{call_id}")
              from_tag=secrets.token_hex(6)
              req_uri=f"sip:{TARGET}@{DOMAIN}"
              offer="\r\n".join([
                  "v=0",
                  f"o=phone11-{USER} 1 1 IN IP4 {local_ip}",
                  "s=Phone11 RTP Echo Self Test",
                  f"c=IN IP4 {local_ip}",
                  "t=0 0",
                  f"m=audio {rtp_port} RTP/AVP 0",
                  "a=rtpmap:0 PCMU/8000",
                  "a=sendrecv",
                  "",
              ])
              def msg(cseq, auth_header=""):
                  branch=f"z9hG4bKv24inv{secrets.token_hex(8)}{cseq}"
                  lines=[
                      f"INVITE {req_uri} SIP/2.0",
                      f"Via: SIP/2.0/UDP {local_ip}:{sip_port};branch={branch};rport",
                      "Max-Forwards: 70",
                      f"From: Phone11 V24 <sip:{USER}@{DOMAIN}>;tag={from_tag}",
                      f"To: <{req_uri}>",
                      f"Call-ID: {call_id}",
                      f"CSeq: {cseq} INVITE",
                      f"Contact: {contact}",
                      "Allow: INVITE, ACK, CANCEL, BYE, OPTIONS",
                      "User-Agent: Phone11RtpEchoSelfTest/24",
                  ]
                  if auth_header:
                      lines.append(auth_header)
                  lines += ["Content-Type: application/sdp", f"Content-Length: {len(offer.encode())}", "", offer]
                  return "\r\n".join(lines)
              cseq=1
              send_sip(msg(cseq))
              got_200=""
              auth_attempts=0
              deadline=time.time()+35
              while time.time()<deadline and not got_200:
                  text,addr=recv_call(call_id, max(0.5, deadline-time.time()))
                  code=status_code(text)
                  print(f"caller_rx_status={code} from={addr[0]}:{addr[1]}")
                  if code in (401,407):
                      auth_attempts += 1
                      if auth_attempts > 5:
                          raise RuntimeError("too many INVITE auth challenges")
                      challenge=header(text,"WWW-Authenticate") or header(text,"Proxy-Authenticate")
                      name="Proxy-Authorization" if code == 407 else "Authorization"
                      cseq += 1
                      send_sip(msg(cseq, f"{name}: {digest_value(USER, PASSWORD, challenge, 'INVITE', req_uri)}"))
                  elif code == 200 and "application/sdp" in text.lower():
                      got_200=text
              if not got_200:
                  raise RuntimeError("no 200 OK with SDP")
              sdp=body(got_200)
              media_ip, media_port=parse_sdp_media(sdp)
              to_value=header(got_200, "To")
              print(f"answer_media={media_ip}:{media_port}")
              ack_branch=f"z9hG4bKv24ack{secrets.token_hex(8)}"
              ack_lines=[
                  f"ACK {req_uri} SIP/2.0",
                  f"Via: SIP/2.0/UDP {local_ip}:{sip_port};branch={ack_branch};rport",
                  "Max-Forwards: 70",
                  f"From: Phone11 V24 <sip:{USER}@{DOMAIN}>;tag={from_tag}",
                  f"To: {to_value}",
                  f"Call-ID: {call_id}",
                  f"CSeq: {cseq} ACK",
                  f"Contact: {contact}",
                  "Content-Length: 0",
                  "",
                  "",
              ]
              send_sip("\r\n".join(ack_lines))
              return call_id, media_ip, media_port
          def run_rtp_echo(media_ip, media_port):
              if not media_ip or not media_port:
                  raise RuntimeError("missing answer media address")
              destination=(media_ip, media_port)
              print(f"rtp_destination={destination[0]}:{destination[1]}")
              ssrc=random.randint(1, 0xffffffff)
              seq=random.randint(1, 65000)
              ts=random.randint(1, 0xffffffff)
              tx=0
              rx=0
              deadline=time.time()+10
              next_send=time.time()
              while time.time()<deadline:
                  now=time.time()
                  if now >= next_send:
                      pkt=rtp_packet(seq, ts, ssrc, 0xff if (tx % 2 == 0) else 0x7f)
                      rtp.sendto(pkt, destination)
                      tx += 1
                      seq += 1
                      ts += 160
                      next_send=now+0.02
                  ready,_,_=select.select([rtp], [], [], 0.01)
                  for sock in ready:
                      data,addr=sock.recvfrom(4096)
                      if len(data) >= 12:
                          rx += 1
              print(f"caller_rtp_tx={tx}")
              print(f"caller_rtp_rx={rx}")
              print("MEDIA_SELF_TEST_RESULT=" + ("pass" if tx >= 100 and rx >= 5 else "fail"))
              return tx, rx

          register()
          call_id, media_ip, media_port = invite()
          tx, rx = run_rtp_echo(media_ip, media_port)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"call_id={call_id}\n")
              fh.write(f"rtp_tx={tx}\n")
              fh.write(f"rtp_rx={rx}\n")
          sys.exit(0 if tx >= 100 and rx >= 5 else 71)
          PY

      - name: Fetch server evidence for this Call-ID
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          CALL_ID="${{ steps.rtp.outputs.call_id }}"
          ssh -i ~/.ssh/phone11_rtp_echo_v24_key -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 "$EC2_USER@${{ steps.ec2.outputs.ec2_host }}" 'bash -s' <<REMOTE
          set -Eeuo pipefail
          CALL_ID="$CALL_ID"
          echo "===== V24 Call-ID ====="
          echo "\$CALL_ID"
          echo "===== FreeSWITCH profile auth evidence ====="
          docker exec p11-freeswitch sh -lc 'grep -n "auth-calls\\|sip-port\\|context" /etc/freeswitch/sip_profiles/external.xml | sed -n "1,120p"' || true
          echo "===== Active calls ====="
          docker exec p11-freeswitch fs_cli -x "show calls" || true
          echo "===== Kamailio logs ====="
          if [ -n "\$CALL_ID" ]; then
            docker logs --since 220s --timestamps p11-kamailio 2>&1 | grep -Eia "\$CALL_ID|RTPENGINE|FREESWITCH_REPLY|BEFORE_ANSWER|AFTER_ANSWER|FORCED_PUBLIC|1998|9196|407|200 OK" | tail -n 320 || true
          fi
          echo "===== RTPEngine logs ====="
          docker logs --since 220s --timestamps p11-rtpengine 2>&1 | grep -Eia "\$CALL_ID|1998|9196|offer|answer|packet|created|delete|RTP|warning|error" | tail -n 320 || true
          echo "===== FreeSWITCH logs ====="
          docker logs --since 220s --timestamps p11-freeswitch 2>&1 | grep -Eia "\$CALL_ID|1998|9196|echo|RTP|Codec|media|hangup|error|warning|407|200 OK" | tail -n 320 || true
          echo "===== FreeSWITCH broad recent logs ====="
          docker logs --since 220s --timestamps p11-freeswitch 2>&1 | tail -n 500 || true
          echo "===== Server packet capture summary ====="
          if [ -s /tmp/phone11-v24-media.pcap.txt ]; then
            grep -aE "SIP/2.0|INVITE|ACK|BYE|Call-ID:|CSeq:|c=IN IP4|m=audio|\$CALL_ID|9196|1998" /tmp/phone11-v24-media.pcap.txt | tail -n 420 || true
          else
            echo "no_server_capture"
          fi
          echo "V24_SERVER_EVIDENCE_RESULT=pass"
          REMOTE

name: Phone11 V61 Fix Subscriber Password Source

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - .github/workflows/phone11-fix-subscriber-password-source-v61.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_HOST: 43.210.122.111
  EC2_USER: ubuntu
  DEPLOY_BRANCH: codex/phone11-mobile-pjsip-20260506
  PROJECT_PATH: /opt/phone11ai/cloudphone11
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          fetch-depth: 0

      - name: Patch provisioning to use subscriber password
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/phone-provisioning.ts')
          text = path.read_text()
          original = text

          text = text.replace(
              'function getSipPassword(row: any): string {\n  const ciphertext = toBuffer(row.secret_ciphertext);',
              'function getSipPassword(row: any): string {\n  // Kamailio authenticates against subscriber.password; keep mobile provisioning aligned.\n  if (row.subscriber_password) {\n    return row.subscriber_password;\n  }\n\n  const ciphertext = toBuffer(row.secret_ciphertext);',
          )

          text = text.replace(
              '             sa.sip_username as account_sip_username, sa.sip_domain as account_sip_domain,\n             sa.secret_ciphertext, sa.secret_iv, sa.secret_tag, sa.transport_preference\n      FROM extensions e\n      LEFT JOIN user_extensions ue ON ue.extension_id = e.id AND ue.user_id = $1\n      LEFT JOIN organizations o ON COALESCE(e.org_id, 1) = o.id\n      LEFT JOIN tenants t ON COALESCE(e.tenant_id, e.org_id, 1) = t.id\n      LEFT JOIN sip_accounts sa ON sa.extension_id = e.id AND sa.deleted_at IS NULL\n      WHERE (ue.user_id = $1 OR e.user_id = $1 OR sa.user_id = $1)',
              '             sa.sip_username as account_sip_username, sa.sip_domain as account_sip_domain,\n             sa.secret_ciphertext, sa.secret_iv, sa.secret_tag, sa.transport_preference,\n             sub.password as subscriber_password\n      FROM extensions e\n      LEFT JOIN user_extensions ue ON ue.extension_id = e.id AND ue.user_id = $1\n      LEFT JOIN organizations o ON COALESCE(e.org_id, 1) = o.id\n      LEFT JOIN tenants t ON COALESCE(e.tenant_id, e.org_id, 1) = t.id\n      LEFT JOIN sip_accounts sa ON sa.extension_id = e.id AND sa.deleted_at IS NULL\n      LEFT JOIN subscriber sub ON sub.username = COALESCE(sa.sip_username, e.sip_username, e.extension_number)\n        AND sub.domain = COALESCE(sa.sip_domain, e.sip_domain, $2)\n      WHERE (ue.user_id = $1 OR e.user_id = $1 OR sa.user_id = $1)',
          )

          text = text.replace(
              '      LIMIT 1\n    `, [userId]);',
              '      LIMIT 1\n    `, [userId, DEFAULT_SIP_DOMAIN]);',
              1,
          )

          text = text.replace(
              '               sa.sip_username as account_sip_username, sa.sip_domain as account_sip_domain,\n               sa.secret_ciphertext, sa.secret_iv, sa.secret_tag, sa.transport_preference\n        FROM extensions e\n        LEFT JOIN organizations o ON COALESCE(e.org_id, 1) = o.id\n        LEFT JOIN tenants t ON COALESCE(e.tenant_id, e.org_id, 1) = t.id\n        LEFT JOIN sip_accounts sa ON sa.extension_id = e.id AND sa.deleted_at IS NULL\n        WHERE (e.sip_username = \'1020\' OR e.extension_number = \'1020\')',
              '               sa.sip_username as account_sip_username, sa.sip_domain as account_sip_domain,\n               sa.secret_ciphertext, sa.secret_iv, sa.secret_tag, sa.transport_preference,\n               sub.password as subscriber_password\n        FROM extensions e\n        LEFT JOIN organizations o ON COALESCE(e.org_id, 1) = o.id\n        LEFT JOIN tenants t ON COALESCE(e.tenant_id, e.org_id, 1) = t.id\n        LEFT JOIN sip_accounts sa ON sa.extension_id = e.id AND sa.deleted_at IS NULL\n        LEFT JOIN subscriber sub ON sub.username = COALESCE(sa.sip_username, e.sip_username, e.extension_number)\n          AND sub.domain = COALESCE(sa.sip_domain, e.sip_domain, $1)\n        WHERE (e.sip_username = \'1020\' OR e.extension_number = \'1020\')',
          )

          text = text.replace(
              '        LIMIT 1\n      `);',
              '        LIMIT 1\n      `, [DEFAULT_SIP_DOMAIN]);',
              1,
          )

          if text == original:
              raise SystemExit('No changes were applied; source layout did not match expected V61 patch anchors')

          required = [
              'row.subscriber_password',
              'sub.password as subscriber_password',
              'LEFT JOIN subscriber sub ON sub.username',
              '[userId, DEFAULT_SIP_DOMAIN]',
              '`, [DEFAULT_SIP_DOMAIN]);',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Patch missing expected text: ' + ', '.join(missing))

          path.write_text(text)
          PY
          git diff -- server/phone-provisioning.ts
          git diff --check

      - name: Install and test backend patch
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
          pnpm check

      - name: Commit patch
        id: commit
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- server/phone-provisioning.ts; then
            echo "No provisioning diff to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/phone-provisioning.ts
          git commit -m "Use subscriber password for phone provisioning"
          git push origin HEAD:${DEPLOY_BRANCH}
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Locate EC2 instance
        id: ec2
        run: |
          set -Eeuo pipefail
          INSTANCE_JSON=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${EC2_HOST}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0]' \
            --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          test -n "$INSTANCE_ID" && test "$INSTANCE_ID" != null
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "az=$AZ" >> "$GITHUB_OUTPUT"

      - name: Deploy patched backend to EC2
        run: |
          set -Eeuo pipefail
          KEY_PATH="${HOME}/.ssh/phone11_v61_key"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f "$KEY_PATH" -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --availability-zone "${{ steps.ec2.outputs.az }}" \
            --instance-os-user "$EC2_USER" \
            --ssh-public-key "file://${KEY_PATH}.pub" >/dev/null

          ssh -i "$KEY_PATH" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          PROJECT_PATH="/opt/phone11ai/cloudphone11"
          DEPLOY_BRANCH="codex/phone11-mobile-pjsip-20260506"
          DEPLOY_CHECKOUT="/opt/phone11ai/codex-phone11-deploy"
          REPO_URL="https://github.com/vasavas1977/codex-phone11.git"

          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO mkdir -p "$(dirname "$DEPLOY_CHECKOUT")"
          if [ ! -d "$DEPLOY_CHECKOUT/.git" ]; then
            $SUDO rm -rf "$DEPLOY_CHECKOUT"
            $SUDO mkdir -p "$DEPLOY_CHECKOUT"
            $SUDO chown -R "$(id -u):$(id -g)" "$DEPLOY_CHECKOUT"
            git clone --branch "$DEPLOY_BRANCH" "$REPO_URL" "$DEPLOY_CHECKOUT"
          fi

          cd "$DEPLOY_CHECKOUT"
          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"
          echo "Deploying commit $(git rev-parse HEAD)"

          ENV_FILE="$DEPLOY_CHECKOUT/.env"
          ENV_SOURCE=""
          for candidate in \
            "$PROJECT_PATH/infra/compose/.env" \
            "$PROJECT_PATH/.env" \
            "$PROJECT_PATH/infra/compose/.env.production" \
            "$PROJECT_PATH/.env.production" \
            "/opt/phone11ai/.env"; do
            if [ -f "$candidate" ]; then ENV_SOURCE="$candidate"; break; fi
          done
          if [ -n "$ENV_SOURCE" ]; then
            cp -a "$ENV_SOURCE" "$ENV_FILE"
          else
            touch "$ENV_FILE"
          fi
          cp -a "$ENV_FILE" infra/compose/.env

          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          else
            COMPOSE="docker-compose"
          fi

          $COMPOSE --env-file "$ENV_FILE" -f infra/compose/docker-compose.prod.yml build backend
          $COMPOSE --env-file "$ENV_FILE" -f infra/compose/docker-compose.prod.yml up -d backend
          $COMPOSE --env-file "$ENV_FILE" -f infra/compose/docker-compose.prod.yml ps backend

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo
              echo "V61_BACKEND_HEALTH=pass"
              exit 0
            fi
            sleep 3
          done

          echo "V61_BACKEND_HEALTH=fail"
          $COMPOSE --env-file "$ENV_FILE" -f infra/compose/docker-compose.prod.yml logs --tail=160 backend || true
          exit 24
          REMOTE

      - name: Verify live provisioning password source
        run: |
          set -Eeuo pipefail
          KEY_PATH="${HOME}/.ssh/phone11_v61_verify_key"
          ssh-keygen -t ed25519 -N '' -f "$KEY_PATH" -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --availability-zone "${{ steps.ec2.outputs.az }}" \
            --instance-os-user "$EC2_USER" \
            --ssh-public-key "file://${KEY_PATH}.pub" >/dev/null
          ssh -i "$KEY_PATH" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/phone11ai/codex-phone11-deploy
          echo "V61_DEPLOYED_SHA=$(git rev-parse HEAD)"
          docker exec cp11-postgres psql -U cloudphone11 -d cloudphone11 -tAc "SELECT username || '|' || domain || '|len=' || length(password) FROM subscriber WHERE username='1001' AND domain='sip.phone11.ai';" || true
          docker exec cp11-postgres psql -U cloudphone11 -d cloudphone11 -tAc "SELECT e.extension_number || '|user=' || COALESCE(e.user_id::text,'null') || '|account=' || COALESCE(sa.sip_username,'null') FROM extensions e LEFT JOIN sip_accounts sa ON sa.extension_id=e.id AND sa.deleted_at IS NULL WHERE e.extension_number='1001' ORDER BY e.id LIMIT 1;" || true
          REMOTE

name: Phone11 Live Public Voice Exchange Self Test V3

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - ".github/workflows/phone11-live-public-voice-exchange-self-test-v3.yml"
  workflow_dispatch:
    inputs:
      ec2_host:
        description: Live SIP/media EC2 host
        required: true
        default: 43.210.122.111
      test_extension:
        description: Dedicated SIP extension for automated media testing
        required: true
        default: "1996"
      test_destination:
        description: FreeSWITCH echo extension for RTP voice exchange verification
        required: true
        default: "9196"

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_USER: ubuntu
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  voice-exchange-self-test:
    name: Verify public SIP answer and RTP both ways
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Locate live SIP/media EC2 instance
        id: ec2
        shell: bash
        run: |
          set -Eeuo pipefail
          EC2_HOST="${{ github.event.inputs.ec2_host || '43.210.122.111' }}"
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "ERROR: AWS credentials are not configured."
            exit 30
          fi
          INSTANCE_JSON=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=$EC2_HOST" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0]' \
            --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "null" ]; then
            echo "ERROR: Could not find running EC2 instance for $EC2_HOST"
            exit 31
          fi
          echo "ec2_host=$EC2_HOST" >> "$GITHUB_OUTPUT"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "az=$AZ" >> "$GITHUB_OUTPUT"
          echo "Found EC2 instance $INSTANCE_ID in $AZ"

      - name: Prepare temporary SSH key
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/phone11_public_voice_v3_key -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --availability-zone "${{ steps.ec2.outputs.az }}" \
            --instance-os-user "$EC2_USER" \
            --ssh-public-key "file://$HOME/.ssh/phone11_public_voice_v3_key.pub" >/dev/null

      - name: Ensure dedicated media test SIP account
        id: credential
        shell: bash
        run: |
          set -Eeuo pipefail
          EC2_HOST="${{ steps.ec2.outputs.ec2_host }}"
          TEST_EXTENSION="${{ github.event.inputs.test_extension || '1996' }}"
          PASS_FILE="$RUNNER_TEMP/phone11_media_test_sip_password"
          ERR_FILE="$RUNNER_TEMP/phone11_media_test_lookup.err"
          rm -f "$PASS_FILE" "$ERR_FILE"

          set +e
          ssh -i ~/.ssh/phone11_public_voice_v3_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            "$EC2_USER@$EC2_HOST" \
            "TEST_EXTENSION='$TEST_EXTENSION' bash -s" >"$PASS_FILE" 2>"$ERR_FILE" <<'REMOTE'
          set -Eeuo pipefail
          docker exec -i -e TEST_EXTENSION="$TEST_EXTENSION" cp11-backend node --input-type=module <<'NODE'
          import crypto from 'crypto';
          import pg from 'pg';

          const extension = process.env.TEST_EXTENSION || '1996';
          const domain = process.env.SIP_DOMAIN || 'sip.phone11.ai';
          const firstEnv = (...keys) => keys.map((key) => process.env[key]).find(Boolean);
          const cfg = {
            host: firstEnv('PG_HOST', 'DB_HOST', 'POSTGRES_HOST'),
            port: Number(firstEnv('PG_PORT', 'DB_PORT', 'POSTGRES_PORT') || 5432),
            user: firstEnv('PG_USER', 'DB_USER', 'POSTGRES_USER'),
            password: firstEnv('PG_PASSWORD', 'DB_PASSWORD', 'POSTGRES_PASSWORD'),
            database: firstEnv('PG_DATABASE', 'DB_NAME', 'DB_DATABASE', 'POSTGRES_DB'),
          };
          const missing = Object.entries(cfg).filter(([key, value]) => key !== 'port' && !value).map(([key]) => key);
          if (missing.length) {
            console.error(`missing backend db env: ${missing.join(',')}`);
            process.exit(2);
          }

          const charset = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%';
          const bytes = crypto.randomBytes(24);
          const password = Array.from(bytes).map((b) => charset[b % charset.length]).join('');
          const ha1 = crypto.createHash('md5').update(`${extension}:${domain}:${password}`).digest('hex');
          const ha1b = crypto.createHash('md5').update(`${extension}@${domain}:${domain}:${password}`).digest('hex');
          const dekSecret = process.env.SIP_DEK_SECRET || 'phone11-sip-dek-v1-change-in-production';
          const key = crypto.createHash('sha256').update(dekSecret).digest();
          const iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
          const ciphertext = Buffer.concat([cipher.update(password, 'utf8'), cipher.final()]);
          const tag = cipher.getAuthTag();

          const sslMode = firstEnv('PG_SSL', 'DB_SSL', 'POSTGRES_SSL', 'DATABASE_SSL')?.toLowerCase();
          const ssl = sslMode === 'false' || sslMode === '0' || sslMode === 'disable' ? false : { rejectUnauthorized: false };
          const pool = new pg.Pool({ ...cfg, ssl, connectionTimeoutMillis: 5000 });
          try {
            await pool.query('BEGIN');
            await pool.query(`
              INSERT INTO subscriber (username, domain, password, ha1, ha1b)
              VALUES ($1, $2, $3, $4, $5)
              ON CONFLICT (username, domain) DO UPDATE SET
                password = EXCLUDED.password,
                ha1 = EXCLUDED.ha1,
                ha1b = EXCLUDED.ha1b
            `, [extension, domain, password, ha1, ha1b]);

            let ext = await pool.query(`
              SELECT id FROM extensions
              WHERE (extension_number = $1 OR sip_username = $1)
                AND deleted_at IS NULL
              ORDER BY id ASC
              LIMIT 1
            `, [extension]);
            let extensionId;
            if (ext.rows.length) {
              extensionId = ext.rows[0].id;
              await pool.query(`
                UPDATE extensions
                SET org_id = COALESCE(org_id, 1), tenant_id = COALESCE(tenant_id, 1),
                    extension_number = $1, sip_username = $1, sip_domain = $2,
                    sip_password = $3, display_name = 'Phone11 Media Self Test',
                    transport = 'UDP', status = 'active', type = COALESCE(type, 'user'),
                    updated_at = NOW()
                WHERE id = $4
              `, [extension, domain, password, extensionId]);
            } else {
              const inserted = await pool.query(`
                INSERT INTO extensions (
                  org_id, tenant_id, extension_number, sip_username, sip_domain, sip_password,
                  display_name, transport, status, type
                )
                VALUES (1, 1, $1, $1, $2, $3, 'Phone11 Media Self Test', 'UDP', 'active', 'user')
                RETURNING id
              `, [extension, domain, password]);
              extensionId = inserted.rows[0].id;
            }

            const account = await pool.query(`
              SELECT id FROM sip_accounts
              WHERE extension_id = $1 AND deleted_at IS NULL
              ORDER BY id ASC
              LIMIT 1
            `, [extensionId]);
            if (account.rows.length) {
              await pool.query(`
                UPDATE sip_accounts
                SET tenant_id = 1, org_id = 1, sip_username = $1, sip_domain = $2,
                    ha1 = $3, ha1b = $4, secret_ciphertext = $5,
                    secret_iv = $6, secret_tag = $7, dek_id = 'dek-v1',
                    transport_preference = 'UDP', status = 'active', updated_at = NOW()
                WHERE id = $8
              `, [extension, domain, ha1, ha1b, ciphertext, iv, tag, account.rows[0].id]);
            } else {
              await pool.query(`
                INSERT INTO sip_accounts (
                  tenant_id, org_id, extension_id, sip_username, sip_domain, ha1, ha1b,
                  secret_ciphertext, secret_iv, secret_tag, dek_id, transport_preference, status
                )
                VALUES (1, 1, $1, $2, $3, $4, $5, $6, $7, $8, 'dek-v1', 'UDP', 'active')
              `, [extensionId, extension, domain, ha1, ha1b, ciphertext, iv, tag]);
            }

            await pool.query('COMMIT');
            console.error(`media_test_extension_ready=${extension}; extension_id=${extensionId}; domain=${domain}`);
            process.stdout.write(password);
          } catch (error) {
            await pool.query('ROLLBACK').catch(() => {});
            console.error(`media test extension setup exception: ${error.name}: ${error.message}`);
            process.exit(4);
          } finally {
            await pool.end().catch(() => {});
          }
          NODE
          REMOTE
          SSH_STATUS=$?
          set -e

          tr -d '\r\n' < "$PASS_FILE" > "$PASS_FILE.clean" || true
          mv "$PASS_FILE.clean" "$PASS_FILE" || true
          if [ "$SSH_STATUS" -ne 0 ] || [ ! -s "$PASS_FILE" ]; then
            echo "ERROR: Could not create/read media test SIP password for extension ${TEST_EXTENSION}."
            sed -E 's#(password|secret|token|authorization)([=:][[:space:]]*)[^[:space:],;]+#\1\2<redacted>#Ig' "$ERR_FILE" || true
            exit 54
          fi
          echo "::add-mask::$(cat "$PASS_FILE")"
          echo "media_test_extension=$TEST_EXTENSION"
          echo "sip_credential_lookup=ok source=managed_media_test_account"
          sed -E 's#(password|secret|token|authorization)([=:][[:space:]]*)[^[:space:],;]+#\1\2<redacted>#Ig' "$ERR_FILE" || true
          echo "password_file=$PASS_FILE" >> "$GITHUB_OUTPUT"

      - name: Run public SIP/RTP voice exchange self-test
        shell: bash
        run: |
          set -Eeuo pipefail
          TEST_EXTENSION="${{ github.event.inputs.test_extension || '1996' }}"
          TEST_DESTINATION="${{ github.event.inputs.test_destination || '9196' }}"
          PASS_FILE="${{ steps.credential.outputs.password_file }}"
          SIP_PASSWORD="$(cat "$PASS_FILE")"
          export SIP_PASSWORD TEST_EXTENSION TEST_DESTINATION

          PUBLIC_IP="$(curl -fsS https://checkip.amazonaws.com 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$PUBLIC_IP" ]; then
            PUBLIC_IP="$(curl -fsS https://api.ipify.org 2>/dev/null | tr -d '[:space:]' || true)"
          fi
          if [ -z "$PUBLIC_IP" ]; then
            echo "ERROR: Could not discover GitHub runner public IP for SDP."
            exit 55
          fi
          export PUBLIC_IP
          echo "runner_public_ip=$PUBLIC_IP"
          echo "sip_target=sip.phone11.ai:5060"
          echo "test_uri=sip:${TEST_DESTINATION}@sip.phone11.ai"

          PYLOG="$RUNNER_TEMP/phone11-public-voice-exchange-v3.log"
          set +e
          timeout 55 python3 - <<'PYTEST' > "$PYLOG" 2>&1
          import hashlib
          import os
          import random
          import re
          import secrets
          import select
          import socket
          import struct
          import sys
          import time

          domain = "sip.phone11.ai"
          server = (domain, 5060)
          username = os.environ["TEST_EXTENSION"]
          password = os.environ["SIP_PASSWORD"]
          destination = os.environ["TEST_DESTINATION"]
          public_ip = os.environ["PUBLIC_IP"]
          sip_port = random.randint(24000, 27999)
          rtp_port = random.randrange(28000, 31998, 2)
          req_uri = f"sip:{destination}@{domain}"
          call_id = f"phone11-public-voice-{secrets.token_hex(8)}@{public_ip}"
          from_tag = secrets.token_hex(6)
          branch_seed = secrets.token_hex(8)
          contact = f"<sip:{username}@{public_ip}:{sip_port}>"

          sip_sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sip_sock.bind(("0.0.0.0", sip_port))
          sip_sock.settimeout(2.0)
          rtp_sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          rtp_sock.bind(("0.0.0.0", rtp_port))
          rtp_sock.setblocking(False)

          sdp = "\r\n".join([
              "v=0",
              f"o=phone11 1 1 IN IP4 {public_ip}",
              "s=Phone11 public voice exchange self test",
              f"c=IN IP4 {public_ip}",
              "t=0 0",
              f"m=audio {rtp_port} RTP/AVP 0",
              "a=rtpmap:0 PCMU/8000",
              "a=sendrecv",
              "",
          ])

          def md5(value: str) -> str:
              return hashlib.md5(value.encode()).hexdigest()

          def header(text: str, name: str) -> str:
              match = re.search(rf"^{re.escape(name)}:\s*(.+)$", text, re.I | re.M)
              return match.group(1).strip() if match else ""

          def parse_auth(value: str) -> dict:
              value = value.replace("Digest", "", 1).strip()
              result = {}
              for key, quoted, bare in re.findall(r'(\w+)=(?:"([^"]*)"|([^,\s]+))', value):
                  result[key.lower()] = quoted or bare
              return result

          def auth_value(challenge: str, method: str) -> str:
              data = parse_auth(challenge)
              realm = data.get("realm", domain)
              nonce = data["nonce"]
              qop_options = data.get("qop", "")
              qop = "auth" if "auth" in qop_options else ""
              cnonce = secrets.token_hex(8)
              nc = "00000001"
              ha1 = md5(f"{username}:{realm}:{password}")
              ha2 = md5(f"{method}:{req_uri}")
              response = md5(f"{ha1}:{nonce}:{nc}:{cnonce}:{qop}:{ha2}") if qop else md5(f"{ha1}:{nonce}:{ha2}")
              parts = [f'username="{username}"', f'realm="{realm}"', f'nonce="{nonce}"', f'uri="{req_uri}"', f'response="{response}"', 'algorithm=MD5']
              if data.get("opaque"):
                  parts.append(f'opaque="{data["opaque"]}"')
              if qop:
                  parts.extend([f'qop={qop}', f'nc={nc}', f'cnonce="{cnonce}"'])
              return "Digest " + ", ".join(parts)

          def build_invite(cseq: int, auth_header: str = "", proxy: bool = False) -> bytes:
              branch = f"z9hG4bK{branch_seed}{cseq}"
              lines = [
                  f"INVITE {req_uri} SIP/2.0",
                  f"Via: SIP/2.0/UDP {public_ip}:{sip_port};branch={branch};rport",
                  "Max-Forwards: 70",
                  f"From: Phone11 Self Test <sip:{username}@{domain}>;tag={from_tag}",
                  f"To: <{req_uri}>",
                  f"Call-ID: {call_id}",
                  f"CSeq: {cseq} INVITE",
                  f"Contact: {contact}",
                  "Allow: INVITE, ACK, CANCEL, BYE, OPTIONS",
                  "Supported: replaces, timer",
                  "User-Agent: Phone11PublicVoiceSelfTest/3.0",
              ]
              if auth_header:
                  lines.append(("Proxy-Authorization" if proxy else "Authorization") + f": {auth_header}")
              lines.extend(["Content-Type: application/sdp", f"Content-Length: {len(sdp.encode())}", "", sdp])
              return "\r\n".join(lines).encode()

          def send_sip(payload: bytes) -> None:
              sip_sock.sendto(payload, server)

          def recv_final(timeout: float) -> tuple[int, str]:
              deadline = time.time() + timeout
              while time.time() < deadline:
                  try:
                      data, _ = sip_sock.recvfrom(65535)
                  except socket.timeout:
                      continue
                  text = data.decode(errors="replace")
                  if call_id not in text:
                      continue
                  first = text.splitlines()[0] if text.splitlines() else ""
                  match = re.match(r"SIP/2.0\s+(\d+)", first)
                  if not match:
                      continue
                  status = int(match.group(1))
                  print(f"sip_response={status}")
                  if status >= 200:
                      return status, text
              raise TimeoutError("No final SIP response received")

          def send_ack(cseq: int, to_header: str) -> None:
              branch = f"z9hG4bK{branch_seed}ack{cseq}"
              lines = [
                  f"ACK {req_uri} SIP/2.0",
                  f"Via: SIP/2.0/UDP {public_ip}:{sip_port};branch={branch};rport",
                  "Max-Forwards: 70",
                  f"From: Phone11 Self Test <sip:{username}@{domain}>;tag={from_tag}",
                  f"To: {to_header}",
                  f"Call-ID: {call_id}",
                  f"CSeq: {cseq} ACK",
                  f"Contact: {contact}",
                  "Content-Length: 0",
                  "",
                  "",
              ]
              send_sip("\r\n".join(lines).encode())

          def send_bye(cseq: int, to_header: str) -> None:
              branch = f"z9hG4bK{branch_seed}bye{cseq}"
              lines = [
                  f"BYE {req_uri} SIP/2.0",
                  f"Via: SIP/2.0/UDP {public_ip}:{sip_port};branch={branch};rport",
                  "Max-Forwards: 70",
                  f"From: Phone11 Self Test <sip:{username}@{domain}>;tag={from_tag}",
                  f"To: {to_header}",
                  f"Call-ID: {call_id}",
                  f"CSeq: {cseq} BYE",
                  f"Contact: {contact}",
                  "Content-Length: 0",
                  "",
                  "",
              ]
              send_sip("\r\n".join(lines).encode())

          def parse_sdp_media(response: str) -> tuple[str, int]:
              body = response.split("\r\n\r\n", 1)[1] if "\r\n\r\n" in response else ""
              media_ip = ""
              media_port = 0
              for line in body.splitlines():
                  if line.startswith("c=IN IP4 "):
                      media_ip = line.split()[2]
                  if line.startswith("m=audio "):
                      media_port = int(line.split()[1])
              if not media_ip or not media_port:
                  raise RuntimeError("No answer media address in 200 OK SDP")
              return media_ip, media_port

          try:
              print(f"call_id={call_id}")
              print(f"sip_bind=0.0.0.0:{sip_port}")
              print(f"rtp_bind=0.0.0.0:{rtp_port}")
              print(f"sdp_advertised={public_ip}")
              send_sip(build_invite(1))
              status, response = recv_final(12)
              cseq = 1
              if status in (401, 407):
                  challenge = header(response, "Proxy-Authenticate") or header(response, "WWW-Authenticate")
                  if not challenge:
                      raise RuntimeError(f"Auth challenge missing for SIP {status}")
                  proxy = status == 407 or bool(header(response, "Proxy-Authenticate"))
                  cseq = 2
                  send_sip(build_invite(cseq, auth_value(challenge, "INVITE"), proxy=proxy))
                  status, response = recv_final(20)
              if status != 200:
                  print(f"python_sip_status=fail status={status}")
                  print("MEDIA_SELF_TEST_RESULT=fail")
                  print("voice_exchange_objective=not_proven")
                  sys.exit(20)

              to_header = header(response, "To") or f"<{req_uri}>"
              media_ip, media_port = parse_sdp_media(response)
              print(f"sip_final_status={status}")
              print(f"answer_media={media_ip}:{media_port}")
              send_ack(cseq, to_header)

              seq = random.randint(0, 65535)
              timestamp = random.randint(0, 2**32 - 1)
              ssrc = random.randint(1, 2**32 - 1)
              received = 0
              sent = 0
              first_rtp_from = ""
              end = time.time() + 12.0
              while time.time() < end:
                  packet = struct.pack("!BBHII", 0x80, 0x00, seq & 0xFFFF, timestamp & 0xFFFFFFFF, ssrc) + (b"\xff" * 160)
                  rtp_sock.sendto(packet, (media_ip, media_port))
                  sent += 1
                  seq += 1
                  timestamp += 160
                  ready, _, _ = select.select([rtp_sock], [], [], 0.02)
                  for sock in ready:
                      data, addr = sock.recvfrom(2048)
                      if len(data) >= 12:
                          received += 1
                          if not first_rtp_from:
                              first_rtp_from = f"{addr[0]}:{addr[1]}"
              drain_end = time.time() + 2.0
              while time.time() < drain_end:
                  ready, _, _ = select.select([rtp_sock], [], [], 0.1)
                  if not ready:
                      continue
                  data, addr = rtp_sock.recvfrom(2048)
                  if len(data) >= 12:
                      received += 1
                      if not first_rtp_from:
                          first_rtp_from = f"{addr[0]}:{addr[1]}"

              send_bye(cseq + 1, to_header)
              print(f"rtp_packets_sent={sent}")
              print(f"rtp_packets_received={received}")
              if first_rtp_from:
                  print(f"first_rtp_from={first_rtp_from}")
              if sent > 0 and received > 0:
                  print("MEDIA_SELF_TEST_RESULT=pass")
                  print("voice_exchange_objective=rtp_packets_seen_both_directions")
                  sys.exit(0)
              print("MEDIA_SELF_TEST_RESULT=fail")
              print("voice_exchange_objective=not_proven")
              sys.exit(60)
          except Exception as exc:
              print(f"python_sip_status=exception {type(exc).__name__}: {exc}")
              print("MEDIA_SELF_TEST_RESULT=fail")
              print("voice_exchange_objective=not_proven")
              sys.exit(61)
          PYTEST
          PY_STATUS=$?
          set -e

          echo "===== Python SIP/RTP summary ====="
          cat "$PYLOG" | sed -E 's#(password|secret|token|authorization)([=:][[:space:]]*)[^[:space:],;]+#\1\2<redacted>#Ig' || true

          CALL_ID="$(awk -F= '/^call_id=/{print $2}' "$PYLOG" | tail -n 1)"
          echo "===== Kamailio media logs from self-test ====="
          if [ -n "$CALL_ID" ]; then
            ssh -i ~/.ssh/phone11_public_voice_v3_key \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=20 \
              "$EC2_USER@${{ steps.ec2.outputs.ec2_host }}" \
              "CALL_ID='$CALL_ID' bash -s" <<'REMOTE_LOGS' | sed -E 's#(password|secret|token|authorization)([=:][[:space:]]*)[^[:space:],;]+#\1\2<redacted>#Ig' || true
          set -Eeuo pipefail
          docker logs --since 180s --timestamps p11-kamailio 2>&1 \
            | grep -Eia "$CALL_ID|RTPENGINE|BEFORE_ANSWER|AFTER_ANSWER|FORCED_PUBLIC_NATIVE_ANSWER_SDP|c=IN IP4|m=audio|INVITE|ACK|BYE|SIP/2.0|9196|1996" \
            | tail -n 240 || true
          REMOTE_LOGS
          else
            echo "No call_id captured from Python log."
          fi

          exit "$PY_STATUS"

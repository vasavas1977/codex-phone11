name: Phone11 V90 Live Backend Provisioning Deploy And Evidence

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - .github/workflows/phone11-live-backend-provisioning-v90.yml
      - ops/phone11-live-backend-provisioning-v90-trigger-*
      - server/phone-provisioning.ts
      - server/routers.ts
      - server/_core/**
      - server/pbx/**
      - infra/docker/backend/Dockerfile
      - infra/compose/docker-compose.prod.yml
      - ops/scripts/redeploy-mobile-branch.sh
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_HOST: 43.210.122.111
  EC2_USER: ubuntu
  DEPLOY_CHECKOUT: /opt/phone11ai/codex-phone11-deploy
  PILOT_USER_ID: '1'
  LATEST_APP_SIP_PW_FP: 2b847b074c0ba53a
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  live-backend-provisioning-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/phone11-mobile-pjsip-20260506

      - name: Redeploy and verify live provisioning credential
        shell: bash
        run: |
          set -Eeuo pipefail
          LOG=/tmp/phone11-live-backend-provisioning-v90.log
          STATUS=0
          INSTANCE_ID=''
          AZ=''
          exec > >(tee "$LOG") 2>&1

          sanitize_log() {
            sed -E \
              -e 's#(Authorization: Bearer )[A-Za-z0-9._~+/=-]+#\1<redacted>#g' \
              -e 's#(PGPASSWORD|DB_PASSWORD|POSTGRES_PASSWORD|JWT_SECRET|AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID|AWS_SESSION_TOKEN)=([^[:space:]]+)#\1=<redacted>#g' \
              -e 's#(postgres://)[^:@/]+:[^@]+@#\1<redacted>:<redacted>@#g' \
              "$LOG" 2>/dev/null || true
          }

          write_status() {
            local result='success'
            if [ "$STATUS" != '0' ]; then result='failure'; fi
            git fetch origin "$GITHUB_REF_NAME" >/dev/null 2>&1 || true
            git pull --rebase origin "$GITHUB_REF_NAME" >/dev/null 2>&1 || true
            mkdir -p ops
            {
              echo '# Phone11 V90 Live Backend Provisioning Status'
              echo ''
              echo "- Time UTC: $(date -u -Iseconds)"
              echo "- Branch: $GITHUB_REF_NAME"
              echo "- Workflow commit: $GITHUB_SHA"
              echo "- Live EC2 host: $EC2_HOST"
              echo "- Live EC2 instance: ${INSTANCE_ID:-not-set}"
              echo "- Pilot user id: $PILOT_USER_ID"
              echo "- Latest app SIP password fingerprint from user log: $LATEST_APP_SIP_PW_FP"
              echo "- Result: $result"
              echo "- Exit code: $STATUS"
              echo ''
              echo '## Sanitized output'
              echo '```text'
              sanitize_log
              echo '```'
            } > ops/phone11-live-backend-provisioning-v90-status.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ops/phone11-live-backend-provisioning-v90-status.md
            if git diff --cached --quiet; then
              echo 'No V90 status file changes to commit.'
            else
              git commit -m "Update Phone11 V90 live provisioning status" || true
              git push || true
            fi
          }

          trap 'STATUS=$?; write_status; exit $STATUS' EXIT

          echo '=== Phone11 V90 live backend provisioning deploy and evidence ==='
          echo "Time: $(date -u -Iseconds)"
          echo "Live EC2 host: $EC2_HOST"
          echo "Expected latest app password fingerprint: $LATEST_APP_SIP_PW_FP"

          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo 'ERROR: AWS credentials are not configured.'
            exit 30
          fi

          echo '--- Locate live EC2 ---'
          INSTANCE_JSON=$(aws ec2 describe-instances --filters "Name=ip-address,Values=$EC2_HOST" "Name=instance-state-name,Values=running" --query 'Reservations[0].Instances[0]' --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = 'null' ]; then
            echo "ERROR: Could not find running EC2 instance for live host $EC2_HOST"
            exit 32
          fi
          echo "Found live EC2 instance $INSTANCE_ID in $AZ"

          echo '--- Prepare temporary SSH access ---'
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/phone11_v90_eic_key -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key --instance-id "$INSTANCE_ID" --availability-zone "$AZ" --instance-os-user "$EC2_USER" --ssh-public-key "file://$HOME/.ssh/phone11_v90_eic_key.pub"

          echo '--- Copy deploy script to live EC2 ---'
          scp -i ~/.ssh/phone11_v90_eic_key -o StrictHostKeyChecking=no ops/scripts/redeploy-mobile-branch.sh "$EC2_USER@$EC2_HOST:/tmp/phone11-v90-redeploy-mobile-branch.sh"

          echo '--- Redeploy current branch commit to live backend ---'
          ssh -i ~/.ssh/phone11_v90_eic_key -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "AWS_DEFAULT_REGION='$AWS_DEFAULT_REGION' GITHUB_SHA='$GITHUB_SHA' DEPLOY_CHECKOUT='$DEPLOY_CHECKOUT' PILOT_USER_ID='$PILOT_USER_ID' bash /tmp/phone11-v90-redeploy-mobile-branch.sh"

          echo '--- Prepare remote credential evidence script ---'
          cat >/tmp/phone11-v90-provisioning-evidence.sh <<'REMOTE'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          echo '--- Runtime containers ---'
          docker ps --format '{{.Names}} {{.Image}} {{.Status}}' | grep -E '^cp11-backend\b|phone11|kamailio' || true

          echo '--- Public and local health ---'
          curl -fsS --connect-timeout 5 --max-time 12 https://api.phone11.ai/api/health
          echo
          curl -fsS --connect-timeout 5 --max-time 12 http://127.0.0.1:3000/api/health
          echo

          echo '--- Backend env keys, names only ---'
          docker exec cp11-backend sh -lc 'env | sort | awk -F= '\''/^(DB_HOST|DB_NAME|DB_USER|DB_PASSWORD|JWT_SECRET|SIP_DOMAIN|VITE_APP_ID)=/ { print $1"=<set>" }'\'''

          echo '--- Provisioning credential fingerprint evidence ---'
          docker exec -i -e PILOT_USER_ID="${PILOT_USER_ID:-1}" -e LATEST_APP_SIP_PW_FP="${LATEST_APP_SIP_PW_FP:-}" cp11-backend node --input-type=module - <<'NODE'
          import crypto from 'node:crypto';
          import pg from 'pg';
          import { SignJWT } from 'jose';
          import { createTRPCClient, httpBatchLink } from '@trpc/client';
          import superjson from 'superjson';

          const firstEnv = (...keys) => keys.map((key) => process.env[key]).find((value) => value && value.length > 0);
          const fp = (value) => value ? crypto.createHash('sha256').update(String(value)).digest('hex').slice(0, 16) : 'none';
          const safe = (value) => ({ present: Boolean(value), len: value ? String(value).length : 0, fp: fp(value) });
          const pilotUserId = Number.parseInt(process.env.PILOT_USER_ID || '1', 10);
          const latestAppFp = process.env.LATEST_APP_SIP_PW_FP || '';
          const cfg = {
            host: firstEnv('PG_HOST', 'DB_HOST', 'POSTGRES_HOST'),
            port: Number(firstEnv('PG_PORT', 'DB_PORT', 'POSTGRES_PORT') || 5432),
            user: firstEnv('PG_USER', 'DB_USER', 'POSTGRES_USER'),
            password: firstEnv('PG_PASSWORD', 'DB_PASSWORD', 'POSTGRES_PASSWORD'),
            database: firstEnv('PG_DATABASE', 'DB_NAME', 'DB_DATABASE', 'POSTGRES_DB'),
          };
          const missing = Object.entries(cfg).filter(([key, value]) => key !== 'port' && !value).map(([key]) => key);
          if (missing.length) throw new Error(`Missing backend DB env: ${missing.join(', ')}`);
          const jwtSecret = firstEnv('JWT_SECRET');
          if (!jwtSecret) throw new Error('JWT_SECRET is missing; app auth cannot be tested');
          const appId = firstEnv('VITE_APP_ID') || '';
          const sslMode = firstEnv('PG_SSL', 'DB_SSL', 'POSTGRES_SSL', 'DATABASE_SSL')?.toLowerCase();
          const ssl = sslMode === 'false' || sslMode === '0' || sslMode === 'disable' ? false : { rejectUnauthorized: false };

          async function loadCredentialRows(pool) {
            const result = await pool.query(`
              SELECT e.id AS extension_id,
                     e.extension_number,
                     e.sip_username AS extension_sip_username,
                     e.sip_domain AS extension_sip_domain,
                     e.sip_password AS extension_sip_password,
                     sa.sip_username AS account_sip_username,
                     sa.sip_domain AS account_sip_domain,
                     sa.transport_preference,
                     sub.password AS subscriber_password,
                     length(sa.secret_ciphertext::text) AS secret_ciphertext_text_len
              FROM extensions e
              LEFT JOIN user_extensions ue ON ue.extension_id = e.id AND ue.user_id = $1
              LEFT JOIN sip_accounts sa ON sa.extension_id = e.id AND sa.deleted_at IS NULL
              LEFT JOIN subscriber sub ON sub.username = COALESCE(sa.sip_username, e.sip_username, e.extension_number)
                AND sub.domain = COALESCE(sa.sip_domain, e.sip_domain, $2)
              WHERE (ue.user_id = $1 OR e.user_id = $1 OR sa.user_id = $1)
                AND COALESCE(e.status, 'active') = 'active'
                AND e.deleted_at IS NULL
              ORDER BY ue.is_primary DESC NULLS LAST, e.id ASC
              LIMIT 5
            `, [pilotUserId, 'sip.phone11.ai']);
            return result.rows;
          }

          console.log(`DB env present: host=${cfg.host}, user=${cfg.user}, database=${cfg.database}, ssl=${ssl ? 'enabled' : 'disabled'}, password=<set>`);
          console.log(`LATEST_APP_SIP_PW_FP=${latestAppFp || 'not-provided'}`);
          const pool = new pg.Pool({ ...cfg, ssl, connectionTimeoutMillis: 5000, max: 2 });
          let user;
          let rowsBefore;
          try {
            const auth = await pool.query('select current_user, current_database()');
            console.log(`DB auth OK: current_user=${auth.rows[0].current_user}, database=${auth.rows[0].current_database}`);
            const userResult = await pool.query('select id, "openId", name, email, role from users where id = $1 limit 1', [pilotUserId]);
            if (!userResult.rows.length) throw new Error(`No users row found for id ${pilotUserId}`);
            user = userResult.rows[0];
            if (!user.openId) throw new Error(`User ${pilotUserId} has no openId`);
            console.log(`Pilot user loaded: id=${user.id}, email=${user.email || '<none>'}, role=${user.role || '<none>'}, openId=<set>`);
            rowsBefore = await loadCredentialRows(pool);
            console.log(`DB credential rows before API: count=${rowsBefore.length}`);
            for (const row of rowsBefore) {
              console.log(`DB_CREDENTIAL_BEFORE extension=${row.extension_number} accountUsername=${row.account_sip_username || row.extension_sip_username || row.extension_number} domain=${row.account_sip_domain || row.extension_sip_domain || 'sip.phone11.ai'} extensionPw=${JSON.stringify(safe(row.extension_sip_password))} subscriberPw=${JSON.stringify(safe(row.subscriber_password))} secretCiphertextTextLen=${row.secret_ciphertext_text_len || 0}`);
            }
          } finally {
            await pool.end();
          }

          const token = await new SignJWT({
            openId: user.openId,
            appId,
            name: user.name || user.email || `User ${user.id}`,
          })
            .setProtectedHeader({ alg: 'HS256', typ: 'JWT' })
            .setExpirationTime(Math.floor((Date.now() + 365 * 24 * 60 * 60 * 1000) / 1000))
            .sign(new TextEncoder().encode(jwtSecret));

          const client = createTRPCClient({
            links: [
              httpBatchLink({
                url: 'http://127.0.0.1:3000/api/trpc',
                transformer: superjson,
                headers() {
                  return { Authorization: `Bearer ${token}` };
                },
              }),
            ],
          });

          const me = await client.auth.me.query();
          if (!me?.id || me.id !== pilotUserId) {
            throw new Error(`auth.me returned wrong user: ${JSON.stringify({ id: me?.id ?? null })}`);
          }
          console.log(`auth.me OK: id=${me.id}, email=${me.email || '<none>'}, openId=<set>`);

          const ensured = await client.phone.ensurePilotConfig.mutate();
          const config = await client.phone.getConfig.query();
          console.log(`ensurePilotConfig result: configured=${Boolean(ensured?.configured)} extension=${ensured?.extension?.number || '<missing>'} username=${ensured?.sip?.username || '<missing>'} domain=${ensured?.sip?.domain || '<missing>'} transport=${ensured?.sip?.transport || '<missing>'} provisioningPw=${JSON.stringify(safe(ensured?.sip?.password))}`);
          console.log(`getConfig result: configured=${Boolean(config?.configured)} extension=${config?.extension?.number || '<missing>'} username=${config?.sip?.username || '<missing>'} domain=${config?.sip?.domain || '<missing>'} transport=${config?.sip?.transport || '<missing>'} provisioningPw=${JSON.stringify(safe(config?.sip?.password))}`);
          if (!config?.configured || !config?.sip?.username || !config?.sip?.password || !config?.sip?.domain) {
            throw new Error('phone.getConfig did not return a complete SIP account');
          }

          const verifyPool = new pg.Pool({ ...cfg, ssl, connectionTimeoutMillis: 5000, max: 2 });
          try {
            const rowsAfter = await loadCredentialRows(verifyPool);
            console.log(`DB credential rows after API: count=${rowsAfter.length}`);
            const current = rowsAfter.find((row) => String(row.account_sip_username || row.extension_sip_username || row.extension_number) === String(config.sip.username)) || rowsAfter[0];
            if (!current) throw new Error('No assigned extension credential row found after provisioning API call');
            const subscriber = current.subscriber_password;
            const extensionPw = current.extension_sip_password;
            console.log(`DB_CREDENTIAL_AFTER extension=${current.extension_number} accountUsername=${current.account_sip_username || current.extension_sip_username || current.extension_number} domain=${current.account_sip_domain || current.extension_sip_domain || 'sip.phone11.ai'} extensionPw=${JSON.stringify(safe(extensionPw))} subscriberPw=${JSON.stringify(safe(subscriber))} secretCiphertextTextLen=${current.secret_ciphertext_text_len || 0}`);
            if (!subscriber) {
              throw new Error('subscriber.password is missing for the provisioned SIP account; Kamailio cannot authenticate this account from provisioning evidence');
            }
            if (config.sip.password !== subscriber) {
              throw new Error(`Provisioning password mismatch: getConfig fp=${fp(config.sip.password)} len=${String(config.sip.password).length}; subscriber fp=${fp(subscriber)} len=${String(subscriber).length}; extension fp=${fp(extensionPw)} len=${extensionPw ? String(extensionPw).length : 0}; latestAppFp=${latestAppFp || 'not-provided'}`);
            }
            if (latestAppFp && fp(config.sip.password) === latestAppFp) {
              console.log('Provisioning currently matches the latest app fingerprint. If registration still gets 401 after this workflow, capture Kamailio auth logs for the same timestamp.');
            } else if (latestAppFp) {
              console.log(`Provisioning now differs from the latest failed app fingerprint: provisioned=${fp(config.sip.password)}, latestFailedApp=${latestAppFp}. Re-sync the phone after this deploy.`);
            }
            console.log(`V90_PROVISIONING_CREDENTIAL_MATCH=true username=${config.sip.username} domain=${config.sip.domain} fp=${fp(config.sip.password)} len=${String(config.sip.password).length}`);
          } finally {
            await verifyPool.end();
          }
          NODE
          REMOTE

          echo '--- Run remote credential evidence script on live EC2 ---'
          scp -i ~/.ssh/phone11_v90_eic_key -o StrictHostKeyChecking=no /tmp/phone11-v90-provisioning-evidence.sh "$EC2_USER@$EC2_HOST:/tmp/phone11-v90-provisioning-evidence.sh"
          ssh -i ~/.ssh/phone11_v90_eic_key -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "PILOT_USER_ID='$PILOT_USER_ID' LATEST_APP_SIP_PW_FP='$LATEST_APP_SIP_PW_FP' bash /tmp/phone11-v90-provisioning-evidence.sh"

          echo 'V90 live backend provisioning deploy and credential evidence succeeded.'

name: Phone11 credential auth proof v77

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - ".github/workflows/phone11-credential-auth-proof-v77.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_USER: ubuntu
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  EC2_HOST: 43.210.122.111

jobs:
  credential-auth-proof:
    name: Compare 1001 credentials and run SIP auth proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Locate EC2 and prepare temporary SSH key
        shell: bash
        run: |
          set -Eeuo pipefail
          INSTANCE_JSON=$(aws ec2 describe-instances --filters "Name=ip-address,Values=$EC2_HOST" "Name=instance-state-name,Values=running" --query 'Reservations[0].Instances[0]' --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "null" ]; then
            echo "ERROR: EC2 not found for $EC2_HOST"
            exit 31
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/phone11_v77_key -C phone11-v77-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key --instance-id "$INSTANCE_ID" --availability-zone "$AZ" --instance-os-user "$EC2_USER" --ssh-public-key "file://$HOME/.ssh/phone11_v77_key.pub" >/dev/null

      - name: Run live credential and SIP auth proof on EC2
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/phone11_v77_key -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          DOMAIN="sip.phone11.ai"
          USERNAME="1001"
          PUBLIC_IP="43.210.122.111"
          TARGET="*9196"

          echo "===== V77 Phone11 credential and SIP auth proof ====="
          echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "goal=prove whether extension 1001 password, HA1, and Kamailio SIP digest auth agree without printing the password"

          KAM_CONTAINER="$(docker ps --format '{{.Names}}' | grep -E '^(p11-kamailio|cp11-kamailio|kamailio)$' | head -n1 || true)"
          PG_CONTAINER="$(docker ps --format '{{.Names}}' | grep -E '^(cp11-postgres|p11-postgres|postgres)$' | head -n1 || true)"
          if [ -z "$KAM_CONTAINER" ]; then echo "ERROR: kamailio container not found"; docker ps --format '{{.Names}} {{.Status}}'; exit 41; fi
          if [ -z "$PG_CONTAINER" ]; then echo "ERROR: postgres container not found"; docker ps --format '{{.Names}} {{.Status}}'; exit 42; fi
          echo "kamailio_container=$KAM_CONTAINER"
          echo "postgres_container=$PG_CONTAINER"

          KAM_IP="$(docker exec "$KAM_CONTAINER" sh -lc "grep -m1 '^listen=udp:' /etc/kamailio/kamailio.cfg 2>/dev/null | sed -E 's/.*udp:([^:]+):5060.*/\\1/'" || true)"
          if [ -z "$KAM_IP" ]; then KAM_IP="$(hostname -I | awk '{print $1}')"; fi
          echo "kamailio_udp_ip=$KAM_IP"
          echo "public_ip=$PUBLIC_IP"

          echo "===== Live Kamailio auth config ====="
          docker exec "$KAM_CONTAINER" sh -lc 'grep -nE "auth_db|route\[AUTH\]|auth_check|auth_challenge|consume_credentials|listen=udp" /etc/kamailio/kamailio.cfg | sed -n "1,180p"' || true

          PGUSER="$(docker exec "$PG_CONTAINER" sh -lc 'printf %s "${POSTGRES_USER:-postgres}"')"
          PGDATABASE="$(docker exec "$PG_CONTAINER" sh -lc 'printf %s "${POSTGRES_DB:-${POSTGRES_USER:-postgres}}"')"
          PGPASSWORD_VALUE="$(docker exec "$PG_CONTAINER" sh -lc 'printf %s "${POSTGRES_PASSWORD:-}"')"

          echo "===== Live DB credential consistency for 1001 (no secret values printed) ====="
          docker exec -i -e PGPASSWORD="$PGPASSWORD_VALUE" "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U "$PGUSER" -d "$PGDATABASE" <<SQL
          \pset pager off
          \pset null '[null]'
          SELECT 'subscriber_row' AS evidence, username, domain,
                 length(password) AS password_len,
                 length(ha1) AS ha1_len,
                 length(ha1b) AS ha1b_len,
                 (ha1 = md5(username || ':' || domain || ':' || password)) AS ha1_matches_password,
                 (ha1b = md5(username || '@' || domain || ':' || domain || ':' || password)) AS ha1b_matches_password
          FROM subscriber
          WHERE username = '$USERNAME' AND domain = '$DOMAIN';

          SELECT 'extension_rows' AS evidence, id, user_id, extension_number,
                 COALESCE(sip_username, extension_number) AS sip_username,
                 COALESCE(sip_domain, '$DOMAIN') AS sip_domain,
                 transport,
                 status,
                 length(COALESCE(sip_password, '')) AS extension_password_len,
                 (COALESCE(sip_password, '') <> '') AS extension_has_password
          FROM extensions
          WHERE extension_number = '$USERNAME' OR sip_username = '$USERNAME' OR user_id = 1
          ORDER BY CASE WHEN extension_number = '$USERNAME' OR sip_username = '$USERNAME' THEN 0 ELSE 1 END, id
          LIMIT 10;

          SELECT 'sip_account_rows' AS evidence, id, extension_id, user_id, sip_username, sip_domain,
                 transport_preference, status,
                 length(COALESCE(ha1, '')) AS ha1_len,
                 length(COALESCE(ha1b, '')) AS ha1b_len,
                 (secret_ciphertext IS NOT NULL) AS has_encrypted_secret
          FROM sip_accounts
          WHERE sip_username = '$USERNAME' OR user_id = 1
          ORDER BY CASE WHEN sip_username = '$USERNAME' THEN 0 ELSE 1 END, id
          LIMIT 10;

          WITH selected_ext AS (
            SELECT id, user_id, extension_number,
                   COALESCE(sip_username, extension_number) AS sip_username,
                   COALESCE(sip_domain, '$DOMAIN') AS sip_domain,
                   COALESCE(sip_password, '') AS extension_password
            FROM extensions
            WHERE extension_number = '$USERNAME' OR sip_username = '$USERNAME' OR user_id = 1
            ORDER BY CASE WHEN extension_number = '$USERNAME' OR sip_username = '$USERNAME' THEN 0 ELSE 1 END, id
            LIMIT 1
          ), selected_sub AS (
            SELECT username, domain, password, ha1, ha1b
            FROM subscriber
            WHERE username = '$USERNAME' AND domain = '$DOMAIN'
            LIMIT 1
          )
          SELECT 'selected_compare' AS evidence,
                 e.id AS extension_id,
                 e.user_id,
                 e.extension_number,
                 e.sip_username,
                 e.sip_domain,
                 length(e.extension_password) AS extension_password_len,
                 length(s.password) AS subscriber_password_len,
                 (e.extension_password = s.password) AS extension_password_equals_subscriber_password,
                 (s.ha1 = md5(s.username || ':' || s.domain || ':' || s.password)) AS subscriber_ha1_matches_subscriber_password,
                 (s.ha1 = md5(e.sip_username || ':' || s.domain || ':' || e.extension_password)) AS subscriber_ha1_matches_extension_password
          FROM selected_ext e
          CROSS JOIN selected_sub s;
          SQL

          SIP_PASSWORD_VALUE="$(docker exec -e PGPASSWORD="$PGPASSWORD_VALUE" "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -At -U "$PGUSER" -d "$PGDATABASE" -c "SELECT password FROM subscriber WHERE username = '$USERNAME' AND domain = '$DOMAIN' LIMIT 1")"
          if [ -z "$SIP_PASSWORD_VALUE" ]; then
            echo "V77_RESULT=no_subscriber_password_for_1001"
            exit 0
          fi
          echo "subscriber_password_present=yes"
          echo "subscriber_password_length=${#SIP_PASSWORD_VALUE}"

          sudo rm -f /tmp/phone11-v77-sip.pcap.txt
          if command -v tcpdump >/dev/null 2>&1; then
            sudo sh -lc 'nohup timeout 130 tcpdump -i any -nn -s0 -A "udp port 5060 or tcp port 5060" > /tmp/phone11-v77-sip.pcap.txt 2>&1 &' || true
            sleep 2
          fi

          export SIP_PASSWORD_VALUE DOMAIN USERNAME PUBLIC_IP TARGET KAM_IP
          set +e
          python3 - <<'PY'
          import hashlib, os, random, re, secrets, select, socket, time

          DOMAIN = os.environ["DOMAIN"]
          USERNAME = os.environ["USERNAME"]
          PASSWORD = os.environ["SIP_PASSWORD_VALUE"]
          PUBLIC_IP = os.environ["PUBLIC_IP"]
          TARGET = os.environ["TARGET"]
          KAM_IP = os.environ["KAM_IP"]
          LOCAL_IP = KAM_IP
          SERVER = (KAM_IP, 5060)

          def md5(value):
              return hashlib.md5(value.encode()).hexdigest()

          def status_code(text):
              first = text.splitlines()[0] if text.splitlines() else ""
              match = re.match(r"SIP/2.0\s+(\d+)\s*(.*)", first)
              return (int(match.group(1)), match.group(2).strip()) if match else (0, first)

          def header(text, name):
              match = re.search(rf"^{re.escape(name)}:\s*(.+)$", text, re.I | re.M)
              return match.group(1).strip() if match else ""

          def all_headers(text, name):
              return re.findall(rf"^{re.escape(name)}:\s*(.+)$", text, re.I | re.M)

          def parse_auth(value):
              value = value.replace("Digest", "", 1).strip()
              return {key.lower(): (quoted or bare) for key, quoted, bare in re.findall(r'(\w+)=(?:"([^"]*)"|([^,\s]+))', value)}

          def digest_header(username, password, challenge, method, uri, header_name):
              data = parse_auth(challenge)
              realm = data.get("realm", DOMAIN)
              nonce = data["nonce"]
              qop = "auth" if "auth" in data.get("qop", "") else ""
              cnonce = secrets.token_hex(8)
              nc = "00000001"
              ha1 = md5(f"{username}:{realm}:{password}")
              ha2 = md5(f"{method}:{uri}")
              response = md5(f"{ha1}:{nonce}:{nc}:{cnonce}:{qop}:{ha2}") if qop else md5(f"{ha1}:{nonce}:{ha2}")
              parts = [
                  f'username="{username}"',
                  f'realm="{realm}"',
                  f'nonce="{nonce}"',
                  f'uri="{uri}"',
                  f'response="{response}"',
                  "algorithm=MD5",
              ]
              if data.get("opaque"):
                  parts.append(f'opaque="{data["opaque"]}"')
              if qop:
                  parts.extend([f"qop={qop}", f"nc={nc}", f'cnonce="{cnonce}"'])
              return f"{header_name}: Digest " + ", ".join(parts)

          def challenge_summary(text):
              chunks = []
              for name in ("WWW-Authenticate", "Proxy-Authenticate"):
                  for value in all_headers(text, name):
                      data = parse_auth(value)
                      chunks.append(f"{name}:realm={data.get('realm','')},qop={data.get('qop','')},nonce_present={'yes' if data.get('nonce') else 'no'}")
              return "; ".join(chunks) if chunks else "none"

          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sock.bind((LOCAL_IP, random.randint(28000, 28999)))
          sock.setblocking(False)
          local_port = sock.getsockname()[1]

          def send(payload):
              sock.sendto(payload.encode(), SERVER)

          def recv_for(call_id, timeout=8):
              deadline = time.time() + timeout
              while time.time() < deadline:
                  ready, _, _ = select.select([sock], [], [], 0.2)
                  if not ready:
                      continue
                  data, _addr = sock.recvfrom(65535)
                  text = data.decode(errors="replace")
                  if call_id in text:
                      return text
              return ""

          def register_variant(host_label, host):
              uri = f"sip:{host}"
              call_id = f"phone11-v77-register-{host_label}-{secrets.token_hex(8)}@ec2"
              tag = secrets.token_hex(5)
              contact = f"<sip:{USERNAME}@{LOCAL_IP}:{local_port};transport=udp>"

              def message(cseq, auth=""):
                  lines = [
                      f"REGISTER {uri} SIP/2.0",
                      f"Via: SIP/2.0/UDP {LOCAL_IP}:{local_port};branch=z9hG4bKv77reg{secrets.token_hex(8)};rport",
                      "Max-Forwards: 70",
                      f"From: <sip:{USERNAME}@{host}>;tag={tag}",
                      f"To: <sip:{USERNAME}@{host}>",
                      f"Call-ID: {call_id}",
                      f"CSeq: {cseq} REGISTER",
                      f"Contact: {contact};expires=300",
                      "Expires: 300",
                      "User-Agent: Phone11AuthProof/77",
                  ]
                  if auth:
                      lines.append(auth)
                  lines.extend(["Content-Length: 0", "", ""])
                  return "\r\n".join(lines)

              send(message(1))
              first = recv_for(call_id)
              code, reason = status_code(first)
              print(f"REGISTER_VARIANT={host_label} first_status={code} reason={reason} challenges={challenge_summary(first)}")
              if code not in (401, 407):
                  print(f"REGISTER_VARIANT={host_label} final_status={code} reason={reason} auth_result=not_challenged")
                  return code
              challenge = header(first, "WWW-Authenticate") or header(first, "Proxy-Authenticate")
              header_name = "Proxy-Authorization" if header(first, "Proxy-Authenticate") else "Authorization"
              send(message(2, digest_header(USERNAME, PASSWORD, challenge, "REGISTER", uri, header_name)))
              final = recv_for(call_id)
              final_code, final_reason = status_code(final)
              result = "accepted" if final_code not in (0, 401, 407) else "rejected"
              print(f"REGISTER_VARIANT={host_label} final_status={final_code} reason={final_reason} auth_header={header_name} auth_result={result}")
              return final_code

          def invite_variant(host_label, host):
              req_uri = f"sip:{TARGET}@{host}"
              call_id = f"phone11-v77-invite-{host_label}-{secrets.token_hex(8)}@ec2"
              tag = secrets.token_hex(5)
              contact = f"<sip:{USERNAME}@{LOCAL_IP}:{local_port};transport=udp>"
              sdp = "\r\n".join([
                  "v=0",
                  f"o=phone11-v77 1 1 IN IP4 {LOCAL_IP}",
                  "s=Phone11 V77 Auth Proof",
                  f"c=IN IP4 {LOCAL_IP}",
                  "t=0 0",
                  "m=audio 30104 RTP/AVP 0",
                  "a=rtpmap:0 PCMU/8000",
                  "a=sendrecv",
                  "",
              ])

              def message(cseq, auth=""):
                  lines = [
                      f"INVITE {req_uri} SIP/2.0",
                      f"Via: SIP/2.0/UDP {LOCAL_IP}:{local_port};branch=z9hG4bKv77inv{secrets.token_hex(8)};rport",
                      "Max-Forwards: 70",
                      f"From: Phone11 V77 <sip:{USERNAME}@{host}>;tag={tag}",
                      f"To: <{req_uri}>",
                      f"Call-ID: {call_id}",
                      f"CSeq: {cseq} INVITE",
                      f"Contact: {contact}",
                      "Allow: INVITE, ACK, CANCEL, BYE, OPTIONS",
                      "User-Agent: Phone11AuthProof/77",
                  ]
                  if auth:
                      lines.append(auth)
                  lines.extend(["Content-Type: application/sdp", f"Content-Length: {len(sdp.encode())}", "", sdp])
                  return "\r\n".join(lines)

              send(message(1))
              first = recv_for(call_id)
              code, reason = status_code(first)
              print(f"INVITE_VARIANT={host_label} first_status={code} reason={reason} challenges={challenge_summary(first)}")
              if code not in (401, 407):
                  print(f"INVITE_VARIANT={host_label} final_status={code} reason={reason} auth_result=not_challenged_or_routed")
                  return code
              challenge = header(first, "Proxy-Authenticate") or header(first, "WWW-Authenticate")
              header_name = "Proxy-Authorization" if header(first, "Proxy-Authenticate") else "Authorization"
              send(message(2, digest_header(USERNAME, PASSWORD, challenge, "INVITE", req_uri, header_name)))
              final = recv_for(call_id, 10)
              final_code, final_reason = status_code(final)
              result = "accepted_or_routed" if final_code not in (0, 401, 407) else "rejected"
              print(f"INVITE_VARIANT={host_label} final_status={final_code} reason={final_reason} auth_header={header_name} auth_result={result}")
              return final_code

          print(f"python_server={SERVER[0]}:{SERVER[1]} local={LOCAL_IP}:{local_port} username={USERNAME} password_present={'yes' if PASSWORD else 'no'} password_length={len(PASSWORD)}")
          register_variant("domain", DOMAIN)
          register_variant("public_ip", PUBLIC_IP)
          invite_variant("domain", DOMAIN)
          invite_variant("public_ip", PUBLIC_IP)
          PY
          PY_EXIT=$?
          set -e
          echo "python_exit=$PY_EXIT"

          echo "===== Recent Kamailio auth logs ====="
          docker logs --since 180s --timestamps "$KAM_CONTAINER" 2>&1 | grep -Eia 'phone11-v77|1001|407|401|REGISTER|INVITE|auth|subscriber|error|warning|nonce|digest' | tail -n 520 || true

          echo "===== SIP packet summary, redacted ====="
          if [ -s /tmp/phone11-v77-sip.pcap.txt ]; then
            sed -E 's/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/<ip>/g; s/(nonce=")[^"]+("?)/\1<redacted>\2/g; s/(response=")[^"]+("?)/\1<redacted>\2/g; s/(cnonce=")[^"]+("?)/\1<redacted>\2/g' /tmp/phone11-v77-sip.pcap.txt \
              | grep -aE 'Phone11AuthProof|SIP/2.0|REGISTER|INVITE|ACK|BYE|Call-ID:|CSeq:|From:|To:|Contact:|WWW-Authenticate|Proxy-Authenticate|Authorization|Proxy-Authorization|realm=|uri=' \
              | tail -n 700 || true
          else
            echo "no_packet_capture"
          fi

          echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "V77_RESULT=completed"
          exit 0
          REMOTE

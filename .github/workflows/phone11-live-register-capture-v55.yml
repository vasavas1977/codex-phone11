name: Phone11 live REGISTER capture v55

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - .github/workflows/phone11-live-register-capture-v55.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-register:
    name: Capture live iPhone REGISTER traffic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/phone11-mobile-pjsip-20260506

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PHONE11_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PHONE11_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-7

      - name: Arm tcpdump REGISTER capture
        run: bash .github/scripts/phone11-live-register-capture-v52.sh

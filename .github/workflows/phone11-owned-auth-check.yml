name: Phone11 Owned Auth Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "hooks/**"
      - "constants/**"
      - "lib/**"
      - "server/**"
      - "tests/phone11-auth*"
      - "scripts/*phone11-auth*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.ts"
      - ".github/workflows/phone11-owned-auth-check.yml"

permissions:
  contents: read

jobs:
  isolated-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - name: Install locked dependencies without mobile postinstall
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install local PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client libpq-dev
      - name: Test auth with disposable local database
        run: pnpm run test:auth
      - name: Test mobile auth state and SIP account isolation
        run: |
          pnpm run test:auth-client
          pnpm run test:auth-sip
      - name: Compile backend and migration operator
        run: |
          pnpm run build:backend
          pnpm run build:auth-admin

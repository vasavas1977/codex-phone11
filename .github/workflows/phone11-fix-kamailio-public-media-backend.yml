name: Phone11 Fix Kamailio Public Media and Backend Route

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - ".github/workflows/phone11-fix-kamailio-public-media-backend.yml"
      - "ops/scripts/fix-kamailio-public-media-and-backend-route.sh"
  workflow_dispatch:
    inputs:
      ec2_host:
        description: Live SIP/media EC2 host running Kamailio
        required: true
        default: 43.210.122.111
      backend_url:
        description: Backend URL reachable from the SIP host
        required: true
        default: http://127.0.0.1:3000
      public_media_ip:
        description: Public media IP to advertise toward native mobile clients
        required: true
        default: 43.210.122.111

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_USER: ubuntu
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  patch-kamailio:
    name: Patch live Kamailio public media/backend route
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Patch live Kamailio config
        shell: bash
        run: |
          set -Eeuo pipefail

          EC2_HOST="${{ github.event.inputs.ec2_host || '43.210.122.111' }}"
          BACKEND_URL="${{ github.event.inputs.backend_url || 'http://127.0.0.1:3000' }}"
          PUBLIC_MEDIA_IP="${{ github.event.inputs.public_media_ip || '43.210.122.111' }}"
          LOG_DIR="$RUNNER_TEMP/phone11-kamailio-public-media-backend-fix"
          LOG_FILE="$LOG_DIR/phone11-kamailio-public-media-backend-fix.txt"
          mkdir -p "$LOG_DIR"

          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo 'ERROR: AWS credentials are not configured.'
            exit 30
          fi

          echo '=== Locate EC2 instance ==='
          INSTANCE_JSON=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=$EC2_HOST" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0]' \
            --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = 'null' ]; then
            echo "ERROR: Could not find running EC2 instance for $EC2_HOST"
            exit 32
          fi
          echo "Found EC2 instance $INSTANCE_ID in $AZ"

          echo '=== Prepare temporary SSH access ==='
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/phone11_kamailio_public_media_key -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$INSTANCE_ID" \
            --availability-zone "$AZ" \
            --instance-os-user "$EC2_USER" \
            --ssh-public-key "file://$HOME/.ssh/phone11_kamailio_public_media_key.pub" >/dev/null

          echo '=== Upload and run live fix script ==='
          scp -i ~/.ssh/phone11_kamailio_public_media_key -o StrictHostKeyChecking=no \
            ops/scripts/fix-kamailio-public-media-and-backend-route.sh \
            "$EC2_USER@$EC2_HOST:/tmp/phone11-fix-kamailio-public-media-and-backend-route.sh"

          ssh -i ~/.ssh/phone11_kamailio_public_media_key -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" \
            "BACKEND_URL='$BACKEND_URL' PUBLIC_MEDIA_IP='$PUBLIC_MEDIA_IP' bash /tmp/phone11-fix-kamailio-public-media-and-backend-route.sh" \
            | tee "$LOG_FILE"

      - name: Upload Kamailio public media/backend fix log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone11-kamailio-public-media-backend-fix-log
          path: ${{ runner.temp }}/phone11-kamailio-public-media-backend-fix/phone11-kamailio-public-media-backend-fix.txt
          if-no-files-found: warn

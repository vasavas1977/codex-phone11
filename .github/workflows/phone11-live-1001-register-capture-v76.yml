name: Phone11 live 1001 SIP REGISTER capture v76

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - .github/workflows/phone11-live-1001-register-capture-v76.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ap-southeast-7
  EC2_USER: ubuntu
  EC2_HOST: 43.210.122.111
  CAPTURE_SECONDS: 180
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Prepare temporary SSH key
        shell: bash
        run: |
          set -Eeuo pipefail
          INSTANCE_JSON=$(aws ec2 describe-instances --filters "Name=ip-address,Values=$EC2_HOST" "Name=instance-state-name,Values=running" --query 'Reservations[0].Instances[0]' --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          test -n "$INSTANCE_ID" && test "$INSTANCE_ID" != null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/phone11_v76_key -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key --instance-id "$INSTANCE_ID" --availability-zone "$AZ" --instance-os-user "$EC2_USER" --ssh-public-key "file://$HOME/.ssh/phone11_v76_key.pub" >/dev/null

      - name: Capture one iPhone 1001 registration attempt
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/phone11_v76_key -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=16 "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          CAPTURE_SECONDS="${CAPTURE_SECONDS:-180}"
          OUT=/tmp/phone11-v76-register.pcap.txt
          FOCUS=/tmp/phone11-v76-register.focus.txt
          CLEAN=/tmp/phone11-v76-register.redacted.txt
          rm -f "$OUT" "$FOCUS" "$CLEAN"
          echo "===== V76 live 1001 SIP REGISTER capture ====="
          date -u +capture_ready_utc=%FT%TZ
          echo "V76_CAPTURE_READY=open_SIP_Diagnostics_and_tap_Start_SIP_Registration_Test_once"
          echo "capture_seconds=$CAPTURE_SECONDS"

          if ! command -v tcpdump >/dev/null 2>&1; then
            echo "V76_BLOCKER=tcpdump_missing_on_ec2"
            exit 32
          fi

          sudo timeout "$CAPTURE_SECONDS" tcpdump -i any -nn -s 0 -vvv -A '(udp port 5060 or tcp port 5060 or udp port 5080 or tcp port 5080)' >"$OUT" 2>&1 || TCPDUMP_STATUS=$?
          echo "tcpdump_status=${TCPDUMP_STATUS:-0}"
          date -u +capture_finished_utc=%FT%TZ

          echo "===== Raw SIP request/status counts, all traffic ====="
          grep -Eiao '(^|[[:space:]])(REGISTER|INVITE|ACK|BYE|CANCEL|OPTIONS) sip:' "$OUT" | sed -E 's/^[[:space:]]+//' | sort | uniq -c || true
          grep -Eiao 'SIP/2\.0 [0-9]{3}[^\r\n]*' "$OUT" | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g' | sort | uniq -c || true

          # Keep only neighborhoods around extension 1001 / Phone11's SIP user-agent. This avoids unrelated pplsip/cisco traffic.
          grep -Eia -B18 -A28 '(^|[[:space:]])REGISTER sip:|sip:1001@|username="1001"|User-Agent: voip|Phone11' "$OUT" >"$FOCUS" || true

          grep -Eia '(^|[[:space:]])REGISTER sip:|SIP/2\.0 [0-9]{3}|WWW-Authenticate|Proxy-Authenticate|Authorization: Digest|Proxy-Authorization: Digest|CSeq:|From:|To:|Call-ID:|Contact:|Via:|User-Agent:|Expires:|realm=|username="1001"|sip:1001@' "$FOCUS" \
            | grep -Eiva 'pplsip|username="cisco"|sip:cisco@' \
            | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g' \
            | sed -E 's/(Call-ID:).*/\1 <redacted>/Ig' \
            | sed -E 's/(branch=z9hG4bK)[^;[:space:]]+/\1<redacted>/Ig' \
            | sed -E 's/(tag=)[^;[:space:]]+/\1<redacted>/Ig' \
            | sed -E 's/(nonce=")[^"]+/\1<redacted>/Ig' \
            | sed -E 's/(response=")[^"]+/\1<redacted>/Ig' \
            | sed -E 's/(cnonce=")[^"]+/\1<redacted>/Ig' \
            | sed -E 's/(opaque=")[^"]+/\1<redacted>/Ig' \
            | sed -E 's/(uri=")[^"]+/\1<redacted>/Ig' \
            | sed -E 's/(Authorization: Digest username="1001", realm=")[^"]+/\1<redacted>/Ig' \
            | sed -E 's/(WWW-Authenticate: Digest realm=")[^"]+/\1<redacted>/Ig' \
            | head -n 520 >"$CLEAN" || true

          echo "===== V76 app-focused redacted REGISTER evidence ====="
          if [ ! -s "$CLEAN" ]; then
            echo "V76_APP_FOCUSED_SIP_SEEN=no"
          else
            cat "$CLEAN"
          fi

          echo "===== V76 app-focused flags ====="
          grep -Eiq '(^|[[:space:]])REGISTER sip:' "$CLEAN" && echo "V76_REGISTER_REQUEST_SEEN=yes" || echo "V76_REGISTER_REQUEST_SEEN=no"
          grep -Eiq 'Authorization: Digest|username="1001"' "$CLEAN" && echo "V76_REGISTER_AUTH_SEEN=yes" || echo "V76_REGISTER_AUTH_SEEN=no"
          grep -Eiq 'WWW-Authenticate: Digest' "$CLEAN" && echo "V76_WWW_CHALLENGE_SEEN=yes" || echo "V76_WWW_CHALLENGE_SEEN=no"
          grep -Eiq 'SIP/2\.0 401' "$CLEAN" && echo "V76_401_SEEN=yes" || echo "V76_401_SEEN=no"
          grep -Eiq 'SIP/2\.0 200' "$CLEAN" && echo "V76_200_SEEN=yes" || echo "V76_200_SEEN=no"
          grep -Eiq 'sip:1001@|username="1001"' "$CLEAN" && echo "V76_1001_SEEN=yes" || echo "V76_1001_SEEN=no"

          echo "===== Kamailio auth log hints during capture window ====="
          SINCE="$(date -u -d "${CAPTURE_SECONDS} seconds ago" +%FT%TZ 2>/dev/null || date -u -v-${CAPTURE_SECONDS}S +%FT%TZ)"
          docker logs --since "$SINCE" --timestamps p11-kamailio 2>&1 \
            | grep -Eia 'REGISTER|1001|401|Unauthorized|auth|digest|nonce|realm|failed|error|warning' \
            | sed -E 's/(nonce=")[^"]+/\1<redacted>/Ig; s/(response=")[^"]+/\1<redacted>/Ig; s/(password=)[^ ,;]+/\1<redacted>/Ig' \
            | tail -n 180 || true

          rm -f "$OUT" "$FOCUS" "$CLEAN"
          echo "V76_CAPTURE_COMPLETE=yes"
          REMOTE

name: Phone11 live SIP call status capture v75

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - .github/workflows/phone11-live-sip-call-capture-v75.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ap-southeast-7
  EC2_USER: ubuntu
  EC2_HOST: 43.210.122.111
  CAPTURE_SECONDS: 180
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Prepare temporary SSH key
        shell: bash
        run: |
          set -Eeuo pipefail
          INSTANCE_JSON=$(aws ec2 describe-instances --filters "Name=ip-address,Values=$EC2_HOST" "Name=instance-state-name,Values=running" --query 'Reservations[0].Instances[0]' --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          test -n "$INSTANCE_ID" && test "$INSTANCE_ID" != null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/phone11_v75_key -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key --instance-id "$INSTANCE_ID" --availability-zone "$AZ" --instance-os-user "$EC2_USER" --ssh-public-key "file://$HOME/.ssh/phone11_v75_key.pub" >/dev/null

      - name: Capture one live PSTN call attempt
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/phone11_v75_key -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=16 "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          CAPTURE_SECONDS="${CAPTURE_SECONDS:-180}"
          OUT=/tmp/phone11-v75-sip-call.pcap.txt
          CLEAN=/tmp/phone11-v75-sip-call.redacted.txt
          rm -f "$OUT" "$CLEAN"
          echo "===== V75 live SIP call capture ====="
          date -u +capture_ready_utc=%FT%TZ
          echo "V75_CAPTURE_READY=place_one_PSTN_call_now"
          echo "capture_seconds=$CAPTURE_SECONDS"
          if ! command -v tcpdump >/dev/null 2>&1; then
            echo "V75_BLOCKER=tcpdump_missing_on_ec2"
            exit 32
          fi
          sudo timeout "$CAPTURE_SECONDS" tcpdump -i any -nn -s 0 -vvv -A '(udp port 5060 or tcp port 5060 or udp port 5080 or tcp port 5080)' >"$OUT" 2>&1 || TCPDUMP_STATUS=$?
          echo "tcpdump_status=${TCPDUMP_STATUS:-0}"
          date -u +capture_finished_utc=%FT%TZ

          echo "===== SIP status summary ====="
          grep -Eiao 'SIP/2\.0 [0-9]{3}[^\r\n]*' "$OUT" | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g' | sort | uniq -c || true

          echo "===== SIP request method summary ====="
          grep -Eiao '(^|[[:space:]])(REGISTER|INVITE|ACK|BYE|CANCEL|OPTIONS) sip:' "$OUT" | sed -E 's/^[[:space:]]+//' | sort | uniq -c || true

          echo "===== Redacted SIP call evidence ====="
          grep -Eia '(^|[[:space:]])(REGISTER|INVITE|ACK|BYE|CANCEL|OPTIONS) sip:|SIP/2\.0 [0-9]{3}|WWW-Authenticate|Proxy-Authenticate|Authorization: Digest|Proxy-Authorization: Digest|CSeq:|From:|To:|Call-ID:|Contact:|Via:|User-Agent:|Allow:' "$OUT" \
            | sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g' \
            | sed -E 's/(Call-ID:).*/\1 <redacted>/Ig' \
            | sed -E 's/(branch=z9hG4bK)[^;[:space:]]+/\1<redacted>/Ig' \
            | sed -E 's/(tag=)[^;[:space:]]+/\1<redacted>/Ig' \
            | sed -E 's/(nonce=")[^"]+/\1<redacted>/Ig' \
            | sed -E 's/(response=")[^"]+/\1<redacted>/Ig' \
            | sed -E 's/(cnonce=")[^"]+/\1<redacted>/Ig' \
            | sed -E 's/(opaque=")[^"]+/\1<redacted>/Ig' \
            | sed -E 's/(uri=")[^"]+/\1<redacted>/Ig' \
            | tail -n 260 > "$CLEAN" || true
          if [ ! -s "$CLEAN" ]; then
            echo "V75_SIP_SEEN=no"
          else
            cat "$CLEAN"
            grep -Eiq '(^|[[:space:]])REGISTER sip:' "$CLEAN" && echo "V75_REGISTER_REQUEST_SEEN=yes" || echo "V75_REGISTER_REQUEST_SEEN=no"
            grep -Eiq '(^|[[:space:]])INVITE sip:' "$CLEAN" && echo "V75_INVITE_REQUEST_SEEN=yes" || echo "V75_INVITE_REQUEST_SEEN=no"
            grep -Eiq 'SIP/2\.0 407' "$CLEAN" && echo "V75_407_SEEN=yes" || echo "V75_407_SEEN=no"
            grep -Eiq 'SIP/2\.0 401' "$CLEAN" && echo "V75_401_SEEN=yes" || echo "V75_401_SEEN=no"
            grep -Eiq 'SIP/2\.0 180|SIP/2\.0 183' "$CLEAN" && echo "V75_RINGING_OR_EARLY_MEDIA_SEEN=yes" || echo "V75_RINGING_OR_EARLY_MEDIA_SEEN=no"
            grep -Eiq 'SIP/2\.0 200' "$CLEAN" && echo "V75_200_SEEN=yes" || echo "V75_200_SEEN=no"
            grep -Eiq 'Authorization: Digest|Proxy-Authorization: Digest' "$CLEAN" && echo "V75_AUTHORIZATION_SEEN=yes" || echo "V75_AUTHORIZATION_SEEN=no"
          fi
          rm -f "$OUT" "$CLEAN"
          echo "V75_CAPTURE_COMPLETE=yes"
          REMOTE

name: Phone11 Live Kamailio Public Alias Patch V16

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - ".github/workflows/phone11-live-kamailio-alias-patch-v16.yml"
  workflow_dispatch:
    inputs:
      ec2_host:
        description: Live SIP/media EC2 host
        required: true
        default: 43.210.122.111

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_USER: ubuntu
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  patch-kamailio-alias:
    name: Add public/FQDN aliases so replies match local socket
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Locate EC2 and prepare temporary SSH key
        id: ec2
        shell: bash
        run: |
          set -Eeuo pipefail
          EC2_HOST="${{ github.event.inputs.ec2_host || '43.210.122.111' }}"
          INSTANCE_JSON=$(aws ec2 describe-instances --filters "Name=ip-address,Values=$EC2_HOST" "Name=instance-state-name,Values=running" --query 'Reservations[0].Instances[0]' --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "null" ]; then
            echo "ERROR: EC2 not found for $EC2_HOST"
            exit 31
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/phone11_alias_v16_key -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key --instance-id "$INSTANCE_ID" --availability-zone "$AZ" --instance-os-user "$EC2_USER" --ssh-public-key "file://$HOME/.ssh/phone11_alias_v16_key.pub" >/dev/null
          echo "ec2_host=$EC2_HOST" >> "$GITHUB_OUTPUT"

      - name: Patch live Kamailio config and restart safely
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/phone11_alias_v16_key -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 "$EC2_USER@${{ steps.ec2.outputs.ec2_host }}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          CFG=/opt/phone11ai/cloudphone11/infra/configs/kamailio/kamailio.cfg
          STAMP="$(date -u +%Y%m%d%H%M%S)"
          BACKUP="${CFG}.bak-v16-${STAMP}"

          echo "===== Before alias patch ====="
          grep -nE '^(listen=|alias=|#!substdef "!MY_DOMAIN|#!substdef "!MY_IP)' "$CFG" || true

          cp "$CFG" "$BACKUP"

          python3 - "$CFG" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          lines = text.splitlines()
          required = [
              "alias=43.210.122.111:5060",
              "alias=sip.phone11.ai:5060",
          ]
          existing = set(line.strip() for line in lines)
          missing = [line for line in required if line not in existing]
          if missing:
              insert_after = 0
              for idx, line in enumerate(lines):
                  if line.startswith("listen="):
                      insert_after = idx + 1
              lines[insert_after:insert_after] = missing
              path.write_text("\n".join(lines) + "\n")
          print("aliases_added=" + ",".join(missing if missing else ["none"]))
          PY

          echo "===== After alias patch ====="
          grep -nE '^(listen=|alias=|#!substdef "!MY_DOMAIN|#!substdef "!MY_IP)' "$CFG" || true

          echo "===== Syntax check ====="
          if ! docker exec p11-kamailio kamailio -c -f /etc/kamailio/kamailio.cfg; then
            echo "Syntax check failed; restoring backup."
            cp "$BACKUP" "$CFG"
            docker restart p11-kamailio >/dev/null
            exit 41
          fi

          echo "===== Restart Kamailio ====="
          docker restart p11-kamailio >/dev/null
          sleep 4
          docker ps --filter name=p11-kamailio --format '{{.Names}} {{.Status}}'
          docker inspect -f 'kamailio_running={{.State.Running}} exit={{.State.ExitCode}}' p11-kamailio

          echo "===== Fresh Kamailio startup errors ====="
          docker logs --since 20s --timestamps p11-kamailio 2>&1 | grep -Eia 'error|critical|fatal|parse|failed' | tail -n 80 || true

          if [ "$(docker inspect -f '{{.State.Running}}' p11-kamailio)" != "true" ]; then
            echo "Kamailio did not remain running; restoring backup."
            cp "$BACKUP" "$CFG"
            docker restart p11-kamailio >/dev/null
            exit 42
          fi

          echo "KAMAILIO_ALIAS_PATCH_RESULT=pass"
          REMOTE

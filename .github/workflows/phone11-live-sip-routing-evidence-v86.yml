name: Phone11 V86 Persisted SIP Routing Evidence

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - .github/workflows/phone11-live-sip-routing-evidence-v86.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_HOST: 43.210.122.111
  EC2_USER: ubuntu
  SIP_HOST: sip.phone11.ai
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  sip-routing-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/phone11-mobile-pjsip-20260506

      - name: Collect evidence
        run: |
          set -uo pipefail
          mkdir -p artifacts
          OUT="artifacts/phone11-v86-sip-routing-evidence.txt"
          : > "$OUT"
          log() { printf '%s\n' "$*" | tee -a "$OUT"; }
          run_log() { log "--- $*"; bash -lc "$*" 2>&1 | tee -a "$OUT"; log "--- exit=$?"; }

          log "V86_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          log "V86_SIP_HOST=$SIP_HOST"
          log "V86_EXPECTED_EC2_HOST=$EC2_HOST"

          log "V86_RUNNER_DNS_BEGIN"
          getent ahostsv4 "$SIP_HOST" 2>&1 | tee -a "$OUT" || true
          python3 - <<'PY' 2>&1 | tee -a "$OUT" || true
          import socket
          host = "sip.phone11.ai"
          try:
              print("V86_RUNNER_PYTHON_ADDRS=" + ",".join(sorted({x[4][0] for x in socket.getaddrinfo(host, 5060, socket.AF_INET, socket.SOCK_DGRAM)})))
          except Exception as exc:
              print("V86_RUNNER_PYTHON_DNS_ERROR=" + repr(exc))
          PY
          log "V86_RUNNER_DNS_END"

          INSTANCE_JSON=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${EC2_HOST}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0]' \
            --output json 2>&1)
          EC2_DESCRIBE_STATUS=$?
          log "V86_EC2_DESCRIBE_STATUS=$EC2_DESCRIBE_STATUS"
          printf '%s\n' "$INSTANCE_JSON" | jq -c '{InstanceId,PrivateIpAddress,PublicIpAddress,Placement}' 2>/dev/null | tee -a "$OUT" || true
          INSTANCE_ID=$(printf '%s' "$INSTANCE_JSON" | jq -r '.InstanceId // empty' 2>/dev/null || true)
          AZ=$(printf '%s' "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty' 2>/dev/null || true)
          log "V86_EC2_INSTANCE_ID=${INSTANCE_ID:-none}"
          log "V86_EC2_AZ=${AZ:-none}"

          if [ -n "${INSTANCE_ID:-}" ] && [ -n "${AZ:-}" ]; then
            KEY_PATH="${HOME}/.ssh/phone11_v86_sip_routing_key"
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            ssh-keygen -t ed25519 -N '' -f "$KEY_PATH" -C phone11-github-actions >/dev/null 2>&1
            if aws ec2-instance-connect send-ssh-public-key \
              --instance-id "$INSTANCE_ID" \
              --availability-zone "$AZ" \
              --instance-os-user "$EC2_USER" \
              --ssh-public-key "file://${KEY_PATH}.pub" >/dev/null 2>&1; then
              log "V86_EIC_PUSH=true"
              ssh -i "$KEY_PATH" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" 'bash -s' >> "$OUT" 2>&1 <<'REMOTE'
              set -uo pipefail
              SIP_HOST="sip.phone11.ai"
              EC2_HOST="43.210.122.111"
              echo "V86_EC2_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "V86_EC2_HOSTNAME=$(hostname)"
              echo "V86_EC2_PUBLIC_IP_EXPECTED=$EC2_HOST"
              echo "V86_EC2_DNS_GETENT_BEGIN"
              getent ahostsv4 "$SIP_HOST" || true
              echo "V86_EC2_DNS_GETENT_END"
              python3 - <<'PY' || true
              import socket
              host = "sip.phone11.ai"
              try:
                  print("V86_EC2_PYTHON_ADDRS=" + ",".join(sorted({x[4][0] for x in socket.getaddrinfo(host, 5060, socket.AF_INET, socket.SOCK_DGRAM)})))
              except Exception as exc:
                  print("V86_EC2_PYTHON_DNS_ERROR=" + repr(exc))
              PY
              echo "V86_EC2_SIP_LISTEN_BEGIN"
              (sudo -n ss -lunpt 2>/dev/null || ss -lunpt || true) | grep -E '(:5060|:5061|:10000|:20000|kamailio|rtpengine)' || true
              echo "V86_EC2_SIP_LISTEN_END"
              echo "V86_DOCKER_CONTAINERS_BEGIN"
              docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}' | grep -Ei 'kamailio|rtp|free|postgres|phone11|sip|5060|5061' || true
              echo "V86_DOCKER_CONTAINERS_END"
              KAMAILIO_CONTAINER=$(docker ps --format '{{.Names}}' | grep -Ei 'kamailio|sip' | head -1 || true)
              echo "V86_KAMAILIO_CONTAINER=${KAMAILIO_CONTAINER:-none}"
              if [ -n "$KAMAILIO_CONTAINER" ]; then
                echo "V86_KAMAILIO_RECENT_1001_BEGIN"
                docker logs --since 60m "$KAMAILIO_CONTAINER" 2>&1 | grep -E '1001|REGISTER|Unauthorized|401|200 OK' | tail -160 | sed -E 's/(response=\")[^\"]+(\")/\1[redacted]\2/g' || true
                echo "V86_KAMAILIO_RECENT_1001_END"
              fi
              ADDRS=$(python3 - <<'PY'
              import socket
              try:
                  print(",".join(sorted({x[4][0] for x in socket.getaddrinfo("sip.phone11.ai", 5060, socket.AF_INET, socket.SOCK_DGRAM)})))
              except Exception:
                  print("")
              PY
              )
              if echo ",$ADDRS," | grep -q ',43.210.122.111,'; then
                echo "V86_DNS_MATCH_EXPECTED=true"
              else
                echo "V86_DNS_MATCH_EXPECTED=false"
              fi
              echo "V86_EC2_DONE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
REMOTE
              log "V86_SSH_STATUS=$?"
            else
              log "V86_EIC_PUSH=false"
            fi
          fi

          log "V86_DONE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Commit evidence artifact
        run: |
          set -Eeuo pipefail
          git config user.name "phone11-actions"
          git config user.email "phone11-actions@users.noreply.github.com"
          git add artifacts/phone11-v86-sip-routing-evidence.txt
          if git diff --cached --quiet; then
            echo "V86_NO_ARTIFACT_CHANGE=true"
          else
            git commit -m "Persist V86 SIP routing evidence [skip ci]"
            git push
          fi

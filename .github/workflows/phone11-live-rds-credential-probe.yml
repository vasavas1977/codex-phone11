name: Phone11 Live RDS Credential Probe

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - ".github/workflows/phone11-live-rds-credential-probe.yml"
  workflow_dispatch:
    inputs:
      ec2_host:
        description: Live SIP/media EC2 host
        required: true
        default: 43.210.122.111

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_USER: ubuntu
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  probe:
    name: Compare live container RDS credentials
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Locate EC2 and prepare temporary SSH key
        id: ec2
        shell: bash
        run: |
          set -Eeuo pipefail
          EC2_HOST="${{ github.event.inputs.ec2_host || '43.210.122.111' }}"
          INSTANCE_JSON=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=$EC2_HOST" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0]' \
            --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "null" ]; then
            echo "ERROR: Could not find running EC2 instance for $EC2_HOST"
            exit 31
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/phone11_rds_probe_key -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$INSTANCE_ID" \
            --availability-zone "$AZ" \
            --instance-os-user "$EC2_USER" \
            --ssh-public-key "file://$HOME/.ssh/phone11_rds_probe_key.pub" >/dev/null
          echo "ec2_host=$EC2_HOST" >> "$GITHUB_OUTPUT"

      - name: Probe RDS credentials without printing secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          EC2_HOST="${{ steps.ec2.outputs.ec2_host }}"
          ssh -i ~/.ssh/phone11_rds_probe_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          echo "===== rds credential source probe ====="
          docker ps --format 'container={{.Names}} image={{.Image}} status={{.Status}}'
          if ! docker ps --format '{{.Names}}' | grep -qx 'p11-kamailio'; then echo 'kamailio_container_missing=yes'; exit 40; fi
          if ! docker ps --format '{{.Names}}' | grep -qx 'cp11-backend'; then echo 'backend_container_missing=yes'; exit 41; fi
          if ! docker ps --format '{{.Names}}' | grep -qx 'cp11-postgres'; then echo 'psql_client_container_missing=yes'; exit 42; fi
          DB_HOST="$(docker exec p11-kamailio sh -lc 'printf %s "${DB_HOST:-}"')"
          DB_USER="$(docker exec p11-kamailio sh -lc 'printf %s "${DB_USER:-}"')"
          DB_NAME="$(docker exec p11-kamailio sh -lc 'printf %s "${DB_NAME:-}"')"
          KAM_PASS="$(docker exec p11-kamailio sh -lc 'printf %s "${DB_PASS:-}"')"
          BACK_PASS="$(docker exec cp11-backend sh -lc 'printf %s "${DB_PASS:-${DATABASE_PASSWORD:-${PGPASSWORD:-}}}"')"
          echo "db_host=$DB_HOST"
          echo "db_user=$DB_USER"
          echo "db_name=$DB_NAME"
          echo "kamailio_db_pass_sha256=$(printf %s "$KAM_PASS" | sha256sum | awk '{print $1}')"
          echo "backend_db_pass_sha256=$(printf %s "$BACK_PASS" | sha256sum | awk '{print $1}')"
          if [ "$KAM_PASS" = "$BACK_PASS" ]; then echo "container_passwords_match=yes"; else echo "container_passwords_match=no"; fi
          test_password() {
            local label="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "${label}_password_present=no"
              return 0
            fi
            echo "${label}_password_present=yes"
            set +e
            docker exec -i -e PGPASSWORD="$value" -e PGSSLMODE=require cp11-postgres \
              psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -c 'SELECT 1 AS ok;' >/tmp/phone11-${label}-psql.out 2>/tmp/phone11-${label}-psql.err
            status=$?
            set -e
            if [ "$status" = "0" ]; then
              echo "${label}_rds_login=ok"
            else
              echo "${label}_rds_login=failed"
              sed -E 's#(password authentication failed for user )"[^"]+"#\1"<db-user>"#g; s#(password|secret|token)[^[:space:]]*#<redacted>#Ig' "/tmp/phone11-${label}-psql.err" | tail -n 6
            fi
          }
          test_password kamailio "$KAM_PASS"
          test_password backend "$BACK_PASS"
          REMOTE

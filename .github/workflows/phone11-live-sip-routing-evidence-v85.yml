name: Phone11 V85 SIP Routing Evidence

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - .github/workflows/phone11-live-sip-routing-evidence-v85.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_HOST: 43.210.122.111
  EC2_USER: ubuntu
  SIP_HOST: sip.phone11.ai
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  sip-routing-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: GitHub runner DNS evidence
        run: |
          set -Eeuo pipefail
          echo "V85_RUNNER_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "V85_SIP_HOST=$SIP_HOST"
          echo "V85_EXPECTED_EC2_HOST=$EC2_HOST"
          echo "V85_RUNNER_GETENT_BEGIN"
          getent ahostsv4 "$SIP_HOST" || true
          echo "V85_RUNNER_GETENT_END"
          python3 - <<'PY'
          import socket
          host = "sip.phone11.ai"
          try:
              print("V85_RUNNER_PYTHON_ADDRS=" + ",".join(sorted({x[4][0] for x in socket.getaddrinfo(host, 5060, socket.AF_INET, socket.SOCK_DGRAM)})))
          except Exception as exc:
              print("V85_RUNNER_PYTHON_DNS_ERROR=" + repr(exc))
          PY

      - name: Locate EC2 instance
        id: ec2
        run: |
          set -Eeuo pipefail
          INSTANCE_JSON=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${EC2_HOST}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0]' \
            --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          PRIVATE_IP=$(echo "$INSTANCE_JSON" | jq -r '.PrivateIpAddress // empty')
          test -n "$INSTANCE_ID" && test "$INSTANCE_ID" != null
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "az=$AZ" >> "$GITHUB_OUTPUT"
          echo "V85_EC2_INSTANCE_ID=$INSTANCE_ID"
          echo "V85_EC2_AZ=$AZ"
          echo "V85_EC2_PRIVATE_IP=$PRIVATE_IP"

      - name: EC2 live SIP routing evidence
        run: |
          set -Eeuo pipefail
          KEY_PATH="${HOME}/.ssh/phone11_v85_sip_routing_key"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f "$KEY_PATH" -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --availability-zone "${{ steps.ec2.outputs.az }}" \
            --instance-os-user "$EC2_USER" \
            --ssh-public-key "file://${KEY_PATH}.pub" >/dev/null

          ssh -i "$KEY_PATH" -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          SIP_HOST="sip.phone11.ai"
          EC2_HOST="43.210.122.111"
          echo "V85_EC2_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "V85_EC2_HOSTNAME=$(hostname)"
          echo "V85_EC2_PUBLIC_IP_EXPECTED=$EC2_HOST"
          echo "V85_EC2_DNS_GETENT_BEGIN"
          getent ahostsv4 "$SIP_HOST" || true
          echo "V85_EC2_DNS_GETENT_END"
          python3 - <<'PY'
          import socket
          host = "sip.phone11.ai"
          try:
              print("V85_EC2_PYTHON_ADDRS=" + ",".join(sorted({x[4][0] for x in socket.getaddrinfo(host, 5060, socket.AF_INET, socket.SOCK_DGRAM)})))
          except Exception as exc:
              print("V85_EC2_PYTHON_DNS_ERROR=" + repr(exc))
          PY

          echo "V85_EC2_SIP_LISTEN_BEGIN"
          (sudo -n ss -lunpt 2>/dev/null || ss -lunpt || true) | grep -E '(:5060|:5061|:10000|:20000|kamailio|rtpengine)' || true
          echo "V85_EC2_SIP_LISTEN_END"

          echo "V85_DOCKER_CONTAINERS_BEGIN"
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}' | grep -Ei 'kamailio|rtp|free|postgres|phone11|sip|5060|5061' || true
          echo "V85_DOCKER_CONTAINERS_END"

          KAMAILIO_CONTAINER=$(docker ps --format '{{.Names}}' | grep -Ei 'kamailio|sip' | head -1 || true)
          echo "V85_KAMAILIO_CONTAINER=${KAMAILIO_CONTAINER:-none}"
          if [ -n "$KAMAILIO_CONTAINER" ]; then
            echo "V85_KAMAILIO_RECENT_1001_BEGIN"
            docker logs --since 30m "$KAMAILIO_CONTAINER" 2>&1 | grep -E '1001|REGISTER|Unauthorized|401|200 OK' | tail -120 | sed -E 's/(response=\")[^\"]+(\")/\1[redacted]\2/g' || true
            echo "V85_KAMAILIO_RECENT_1001_END"
          fi

          ADDRS=$(python3 - <<'PY'
          import socket
          host = "sip.phone11.ai"
          try:
              print(",".join(sorted({x[4][0] for x in socket.getaddrinfo(host, 5060, socket.AF_INET, socket.SOCK_DGRAM)})))
          except Exception:
              print("")
          PY
          )
          if echo ",$ADDRS," | grep -q ',43.210.122.111,'; then
            echo "V85_DNS_MATCH_EXPECTED=true"
          else
            echo "V85_DNS_MATCH_EXPECTED=false"
          fi
          echo "V85_EC2_DONE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REMOTE

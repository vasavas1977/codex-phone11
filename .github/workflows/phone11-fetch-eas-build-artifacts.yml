name: Phone11 Fetch EAS Build Artifacts

on:
  workflow_dispatch:
    inputs:
      eas_build_id:
        description: EAS build ID to inspect
        required: true
        default: f32f8ad9-2c9a-4105-8787-9cce36ec4dc2
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - .github/workflows/phone11-fetch-eas-build-artifacts.yml

jobs:
  fetch:
    name: Fetch EAS build artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      DEFAULT_EAS_BUILD_ID: f32f8ad9-2c9a-4105-8787-9cce36ec4dc2
    steps:
      - name: Require EXPO_TOKEN secret
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN. Add an Expo access token in GitHub repository secrets before running this workflow."
            exit 1
          fi

      - name: Resolve build id
        run: |
          BUILD_ID="${{ github.event.inputs.eas_build_id }}"
          if [ -z "$BUILD_ID" ]; then
            BUILD_ID="$DEFAULT_EAS_BUILD_ID"
          fi
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Inspecting EAS build $BUILD_ID"

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install --global eas-cli@18.13.1

      - name: Confirm EAS account
        run: eas whoami

      - name: Fetch build metadata
        run: |
          mkdir -p eas-artifacts
          eas build:view --help > eas-artifacts/build-view-help.txt 2>&1 || true

          set +e
          eas build:view "$EAS_BUILD_ID" --json > eas-artifacts/build-view.json 2> eas-artifacts/build-view.stderr
          status=$?
          set -e

          echo "build_view_exit_status=$status"
          echo "--- build:view stderr ---"
          cat eas-artifacts/build-view.stderr || true
          echo "--- build:view summary ---"

          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.existsSync('eas-artifacts/build-view.json')
            ? fs.readFileSync('eas-artifacts/build-view.json', 'utf8').trim()
            : '';
          if (!raw || !/^[{[]/.test(raw)) {
            console.log('build:view did not return JSON; continuing to artifact download.');
            process.exit(0);
          }
          try {
            const build = JSON.parse(raw);
            const summary = {
              id: build.id,
              status: build.status,
              platform: build.platform,
              error: build.error,
              profile: build.buildProfile,
              appVersion: build.appVersion,
              appBuildVersion: build.appBuildVersion,
              gitCommitHash: build.gitCommitHash,
              gitCommitMessage: build.gitCommitMessage,
              hasXcodeBuildLogsUrl: Boolean(build.artifacts?.xcodeBuildLogsUrl),
              logFileCount: Array.isArray(build.logFiles) ? build.logFiles.length : 0,
            };
            console.log(JSON.stringify(summary, null, 2));
          } catch (error) {
            console.log(`build:view output was not parseable JSON: ${error.message}`);
          }
          NODE

      - name: Download EAS signed log files before expiry
        run: |
          mkdir -p eas-artifacts/eas-logs
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.existsSync('eas-artifacts/build-view.json')
            ? fs.readFileSync('eas-artifacts/build-view.json', 'utf8').trim()
            : '';
          const entries = [];
          if (raw && /^[{[]/.test(raw)) {
            const build = JSON.parse(raw);
            if (build.artifacts?.xcodeBuildLogsUrl) {
              entries.push(['xcode-build.log', build.artifacts.xcodeBuildLogsUrl]);
            }
            for (const [index, url] of (build.logFiles ?? []).entries()) {
              entries.push([`eas-log-${String(index + 1).padStart(2, '0')}.txt`, url]);
            }
          }
          fs.writeFileSync(
            'eas-artifacts/log-downloads.tsv',
            entries.map(([name, url]) => `${name}\t${url}`).join('\n') + (entries.length ? '\n' : '')
          );
          console.log(`Prepared ${entries.length} EAS log file downloads.`);
          NODE

          if [ ! -s eas-artifacts/log-downloads.tsv ]; then
            echo "No EAS signed log URLs were present in build metadata."
            exit 0
          fi

          download_count=0
          failed_count=0
          while IFS=$'\t' read -r name url || [ -n "$name" ]; do
            [ -z "$name" ] && continue
            echo "Downloading EAS log file: $name"
            if curl --fail --location --silent --show-error --max-time 120 "$url" -o "eas-artifacts/eas-logs/$name"; then
              bytes=$(wc -c < "eas-artifacts/eas-logs/$name" | tr -d ' ')
              echo "Downloaded $name ($bytes bytes)"
              download_count=$((download_count + 1))
            else
              echo "Failed to download $name"
              failed_count=$((failed_count + 1))
            fi
          done < eas-artifacts/log-downloads.tsv

          echo "downloaded_eas_log_files=$download_count"
          echo "failed_eas_log_files=$failed_count"

      - name: Download all available EAS artifacts
        run: |
          mkdir -p eas-artifacts
          set +e
          eas build:download --build-id "$EAS_BUILD_ID" --all-artifacts --json --non-interactive > eas-artifacts/download.json 2> eas-artifacts/download.stderr
          status=$?
          set -e
          echo "download_exit_status=$status"
          echo "--- download stdout ---"
          cat eas-artifacts/download.json || true
          echo "--- download stderr ---"
          cat eas-artifacts/download.stderr || true
          if [ "$status" -ne 0 ]; then
            echo "Download command failed; continuing so available metadata and logs are uploaded."
          fi

      - name: Extract downloaded archives
        run: |
          cd eas-artifacts
          echo "--- artifact file inventory before extraction ---"
          find . -maxdepth 3 -type f -print | sort
          while IFS= read -r file; do
            case "$file" in
              *.zip)
                dir="${file%.zip}-unzipped"
                mkdir -p "$dir"
                unzip -q "$file" -d "$dir" || true
                ;;
              *.tar.gz|*.tgz)
                dir="${file%.tar.gz}-untarred"
                mkdir -p "$dir"
                tar -xzf "$file" -C "$dir" || true
                ;;
            esac
          done < <(find . -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz' \) -print)
          echo "--- artifact file inventory after extraction ---"
          find . -maxdepth 5 -type f -print | sort | head -500

      - name: Print pod/install error context
        run: |
          cd eas-artifacts
          echo "--- files likely to contain pod/build logs ---"
          find . -type f \( -iname '*pod*' -o -iname '*install*' -o -iname '*xcode*' -o -iname '*.log' -o -iname '*.txt' \) -print | sort | head -200
          echo "--- first matching error contexts ---"
          grep -RInE "(pod install|Install pods|ERROR|Error|error:|fatal|failed|Failed|FAILURE|Undefined symbols|No such module|requires new architecture|new architecture|use_frameworks|React-Codegen|PjSipModule|PJSIP|VialerPJSIP|NativeModules|Hermes|Reanimated|Worklets)" . 2>/dev/null | head -300 || true
          echo "--- tail of large log-like files ---"
          while IFS= read -r file; do
            echo "===== $file ====="
            tail -120 "$file" || true
          done < <(find . -type f \( -iname '*.log' -o -iname '*.txt' \) -size -5M -print | sort | head -25)

      - name: Upload fetched artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-artifacts-${{ env.EAS_BUILD_ID }}
          path: eas-artifacts
          if-no-files-found: warn

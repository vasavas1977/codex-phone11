name: Phone11 Fetch EAS Build Artifacts

on:
  workflow_dispatch:
    inputs:
      eas_build_id:
        description: EAS build ID to inspect
        required: true
        default: add42a2c-5061-4620-ace6-fb5f719dbf4f
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - .github/workflows/phone11-fetch-eas-build-artifacts.yml

jobs:
  fetch:
    name: Fetch EAS build artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      DEFAULT_EAS_BUILD_ID: add42a2c-5061-4620-ace6-fb5f719dbf4f
    steps:
      - name: Require EXPO_TOKEN secret
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN. Add an Expo access token in GitHub repository secrets before running this workflow."
            exit 1
          fi

      - name: Resolve build id
        run: |
          BUILD_ID="${{ github.event.inputs.eas_build_id }}"
          if [ -z "$BUILD_ID" ]; then
            BUILD_ID="$DEFAULT_EAS_BUILD_ID"
          fi
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Inspecting EAS build $BUILD_ID"

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect local PJSIP native package after postinstall
        run: |
          echo "--- react-native-pjsip package inventory ---"
          find -L node_modules/react-native-pjsip -maxdepth 5 -type f \( -name '*.podspec' -o -name 'PjSipModule.*' -o -name 'react-native.config.*' \) -print | sort || true
          echo "--- generated podspec ---"
          sed -n '1,220p' node_modules/react-native-pjsip/react-native-pjsip.podspec || true
          echo "--- PjSipModule export markers ---"
          find -L node_modules/react-native-pjsip -path '*/ios/*' -name 'PjSipModule.m' -print -exec grep -nE "RCT_EXPORT_MODULE|@implementation PjSipModule|@interface PjSipModule" {} \;
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('node_modules/react-native-pjsip/ios/RTCPjSip/PjSipModule.m', 'utf8');
          const exportMatch = source.match(/RCT_EXPORT_MODULE[^\n]*/);
          const implementationMatch = source.match(/@implementation PjSipModule[^\n]*/);
          console.log(`legacy_bridge_export=${exportMatch?.[0] || 'MISSING'}`);
          console.log(`module_implementation=${implementationMatch?.[0] || 'MISSING'}`);
          if (!exportMatch || !implementationMatch) {
            throw new Error('react-native-pjsip iOS legacy bridge export is missing after postinstall');
          }
          NODE

      - name: Install EAS CLI
        run: npm install --global eas-cli@18.13.1

      - name: Confirm EAS account
        run: eas whoami

      - name: Fetch build metadata
        run: |
          mkdir -p eas-artifacts/eas-logs
          set +e
          eas build:view "$EAS_BUILD_ID" --json > eas-artifacts/build-view.json 2> eas-artifacts/build-view.stderr
          status=$?
          set -e
          echo "build_view_exit_status=$status"
          echo "--- build:view stderr ---"
          cat eas-artifacts/build-view.stderr || true
          echo "--- build:view summary ---"
          node - <<'NODE'
          const fs = require('fs');
          const path = 'eas-artifacts/build-view.json';
          const raw = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : '';
          if (!raw || !/^[{[]/.test(raw)) {
            console.log('No JSON build metadata returned.');
            process.exit(0);
          }
          const build = JSON.parse(raw);
          const summary = {
            id: build.id,
            status: build.status,
            platform: build.platform,
            error: build.error,
            buildProfile: build.buildProfile,
            gitCommitHash: build.gitCommitHash,
            hasXcodeBuildLogsUrl: Boolean(build.artifacts?.xcodeBuildLogsUrl),
            logFileCount: Array.isArray(build.logFiles) ? build.logFiles.length : 0,
          };
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Download signed EAS log files
        run: |
          mkdir -p eas-artifacts/eas-logs
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.existsSync('eas-artifacts/build-view.json')
            ? fs.readFileSync('eas-artifacts/build-view.json', 'utf8').trim()
            : '';
          const entries = [];
          if (raw && /^[{[]/.test(raw)) {
            const build = JSON.parse(raw);
            if (build.artifacts?.xcodeBuildLogsUrl) entries.push(['xcode-build.log', build.artifacts.xcodeBuildLogsUrl]);
            for (const [index, url] of (build.logFiles || []).entries()) {
              entries.push([`eas-log-${String(index + 1).padStart(2, '0')}.txt`, url]);
            }
          }
          fs.writeFileSync('eas-artifacts/log-downloads.tsv', entries.map(([name, url]) => `${name}\t${url}`).join('\n') + (entries.length ? '\n' : ''));
          console.log(`Prepared ${entries.length} log downloads.`);
          NODE

          if [ ! -s eas-artifacts/log-downloads.tsv ]; then
            echo "No EAS signed log URLs were present in build metadata."
            exit 0
          fi

          while IFS=$'\t' read -r name url || [ -n "$name" ]; do
            [ -z "$name" ] && continue
            echo "Downloading $name"
            curl --fail --location --silent --show-error --max-time 120 "$url" -o "eas-artifacts/eas-logs/$name" || true
            if [ -f "eas-artifacts/eas-logs/$name" ]; then
              wc -c "eas-artifacts/eas-logs/$name"
            fi
          done < eas-artifacts/log-downloads.tsv

      - name: Print iOS pod/native error evidence
        if: always()
        run: |
          cd eas-artifacts
          echo "--- artifact files ---"
          find . -maxdepth 4 -type f -print | sort
          echo "--- relevant pod/native contexts ---"
          grep -RInE "(Install pods|pod install|Podfile|podspec|react-native-pjsip|PjSipModule|RTCPjSip|VialerPJSIP|PJ_AUTOCONF|PJ_HAS_PENTIUM|PJ_IS_LITTLE_ENDIAN|PJ_IS_BIG_ENDIAN|Please specify target machine|HEADER_SEARCH_PATHS|FRAMEWORK_SEARCH_PATHS|OTHER_LDFLAGS|Undefined symbols|No such module|fatal error|error:|failed|Failed|FAILURE)" . 2>/dev/null | head -1000 || true
          echo "--- log tails ---"
          while IFS= read -r file; do
            echo "===== $file ====="
            tail -180 "$file" || true
          done < <(find . -type f \( -iname '*.log' -o -iname '*.txt' -o -iname '*.stderr' \) -size -20M -print | sort | head -40)

      - name: Upload fetched artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-artifacts-${{ env.EAS_BUILD_ID }}
          path: eas-artifacts
          if-no-files-found: warn

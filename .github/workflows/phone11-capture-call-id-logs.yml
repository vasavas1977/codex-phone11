name: Phone11 Capture Exact Call Logs

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - ".github/workflows/phone11-capture-call-id-logs.yml"
      - "ops/phone11-call-id-log-capture-trigger-*"
  workflow_dispatch:
    inputs:
      ec2_host:
        description: Live SIP/media EC2 host
        required: true
        default: 43.210.122.111
      since_minutes:
        description: Minutes of logs to collect
        required: true
        default: "90"
      extension:
        description: SIP extension used by the test phone
        required: true
        default: "1001"
      destination:
        description: PSTN number dialed during the test
        required: true
        default: "020303988"
      call_id:
        description: SIP Call-ID from Kamailio logs
        required: true
        default: "uHdHXhadAcz3AfHPg-31uWab.sAB0e67"

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_USER: ubuntu
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  capture-exact-call:
    name: Capture exact Phone11 call evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Capture exact call logs
        shell: bash
        run: |
          set -Eeuo pipefail

          EC2_HOST="${{ github.event.inputs.ec2_host || '43.210.122.111' }}"
          SINCE_MINUTES="${{ github.event.inputs.since_minutes || '90' }}"
          EXTENSION="${{ github.event.inputs.extension || '1001' }}"
          DESTINATION="${{ github.event.inputs.destination || '020303988' }}"
          CALL_ID="${{ github.event.inputs.call_id || 'uHdHXhadAcz3AfHPg-31uWab.sAB0e67' }}"
          LOG_DIR="$RUNNER_TEMP/phone11-exact-call-logs"
          LOG_FILE="$LOG_DIR/phone11-exact-call-logs.txt"
          mkdir -p "$LOG_DIR"

          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo 'ERROR: AWS credentials are not configured.'
            exit 30
          fi

          echo '=== Locate EC2 instance ==='
          INSTANCE_JSON=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=$EC2_HOST" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0]' \
            --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = 'null' ]; then
            echo "ERROR: Could not find running EC2 instance for $EC2_HOST"
            exit 32
          fi
          echo "Found EC2 instance $INSTANCE_ID in $AZ"

          echo '=== Prepare temporary SSH access ==='
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/phone11_exact_call_key -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$INSTANCE_ID" \
            --availability-zone "$AZ" \
            --instance-os-user "$EC2_USER" \
            --ssh-public-key "file://$HOME/.ssh/phone11_exact_call_key.pub"

          echo '=== Capture exact call evidence ==='
          ssh -i ~/.ssh/phone11_exact_call_key -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" \
            "SINCE_MINUTES='$SINCE_MINUTES' EXTENSION='$EXTENSION' DESTINATION='$DESTINATION' CALL_ID='$CALL_ID' bash -s" <<'REMOTE' | tee "$LOG_FILE"
          set -Eeuo pipefail

          redact() {
            sed -E \
              -e 's#(Authorization: Bearer )[A-Za-z0-9._~+/=-]+#\1<redacted>#g' \
              -e 's#(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|PGPASSWORD|DB_PASSWORD|POSTGRES_PASSWORD|JWT_SECRET|SIP_PASSWORD|PASSWORD|SECRET|TOKEN)=([^[:space:]]+)#\1=<redacted>#Ig' \
              -e 's#(password|passwd|pwd|secret|token|authorization)([=:][[:space:]]*)[^[:space:],;]+#\1\2<redacted>#Ig' \
              -e 's#(postgres(ql)?://[^:[:space:]]+):[^@[:space:]]+@#\1:<redacted>@#Ig'
          }

          section() { printf '\n===== %s =====\n' "$1"; }
          safe_logs() {
            local name="$1"
            local pattern="$2"
            section "docker logs exact call: $name"
            docker logs --since "${SINCE_MINUTES}m" --timestamps "$name" 2>&1 \
              | grep -Eia "$pattern" \
              | tail -n 320 \
              | redact || true
          }
          exec_in() {
            local name="$1"
            local label="$2"
            shift 2
            section "$label: $name"
            docker exec "$name" sh -lc "$*" 2>&1 | redact || true
          }
          esc() { printf '%s' "$1" | sed -E 's/[][(){}.^$*+?|\\]/\\&/g'; }

          section "Phone11 exact call log capture"
          echo "time_utc=$(date -u -Iseconds)"
          echo "since_minutes=${SINCE_MINUTES}"
          echo "extension=${EXTENSION}"
          echo "destination=${DESTINATION}"
          echo "call_id=${CALL_ID}"

          section "containers"
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' | redact || true

          CALL_ID_PATTERN="$(esc "$CALL_ID")"
          EXTENSION_PATTERN="$(esc "$EXTENSION")"
          DESTINATION_PATTERN="$(esc "$DESTINATION")"
          COMMON_PATTERN="${CALL_ID_PATTERN}|${EXTENSION_PATTERN}|${DESTINATION_PATTERN}|INVITE|ACK|BYE|CANCEL|SIP/2.0|180 Ringing|183 Session Progress|200 OK|RTPENGINE|rtpengine|offer|answer|SDP|m=audio|c=IN IP4|rtcp|RTP/AVP|RTP/SAVP|codec|audio|sofia|bridge|CHANNEL_ANSWER|CHANNEL_BRIDGE|hangup|answered|uuid|read_codec|write_codec|RTP|media|port"

          for name in p11-kamailio p11-freeswitch p11-rtpengine cp11-backend; do
            if docker ps --format '{{.Names}}' | grep -qx "$name"; then
              safe_logs "$name" "$COMMON_PATTERN"
            else
              section "missing container: $name"
              echo "not found"
            fi
          done

          if docker ps --format '{{.Names}}' | grep -qx p11-freeswitch; then
            exec_in p11-freeswitch "FreeSWITCH current calls" 'if command -v fs_cli >/dev/null 2>&1; then fs_cli -x "show calls"; fs_cli -x "show channels"; fs_cli -x "show detailed_calls" || true; else echo fs_cli-not-found; fi'
            exec_in p11-freeswitch "FreeSWITCH sofia status profile external" 'if command -v fs_cli >/dev/null 2>&1; then fs_cli -x "sofia status profile external"; else echo fs_cli-not-found; fi'
            exec_in p11-freeswitch "Recent FreeSWITCH CDR/log files mentioning call" 'for root in /var/log/freeswitch /usr/local/freeswitch/log /opt/freeswitch/log; do [ -d "$root" ] || continue; find "$root" -type f -mmin -"${SINCE_MINUTES}" 2>/dev/null | while read -r file; do grep -Eia "${CALL_ID}|${DESTINATION}|${EXTENSION}" "$file" >/dev/null 2>&1 && { echo "--- $file ---"; grep -Eia "${CALL_ID}|${DESTINATION}|${EXTENSION}|codec|rtp|audio|bridge|hangup|answer" "$file" | tail -n 80; }; done; done'
          fi

          if docker ps --format '{{.Names}}' | grep -qx p11-rtpengine; then
            exec_in p11-rtpengine "RTPEngine UDP sockets around call" 'if command -v ss >/dev/null 2>&1; then ss -lunp | grep -E ":(200[0-9][0-9]|21[0-9][0-9][0-9]|22[0-9][0-9][0-9]|23[0-9][0-9][0-9]|24[0-9][0-9][0-9]|25[0-9][0-9][0-9]|26[0-9][0-9][0-9]|27[0-9][0-9][0-9]|28[0-9][0-9][0-9]|29[0-9][0-9][0-9]|30000)" | tail -n 80; else cat /proc/net/udp | tail -n 80; fi'
          fi

          section "capture complete"
          echo "time_utc=$(date -u -Iseconds)"
          REMOTE

      - name: Upload exact call log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone11-exact-call-logs
          path: ${{ runner.temp }}/phone11-exact-call-logs/phone11-exact-call-logs.txt
          if-no-files-found: warn

name: Phone11 Capture Target Call Logs

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - ".github/workflows/phone11-capture-target-call-logs.yml"
      - "ops/phone11-target-call-log-trigger-*"
  workflow_dispatch:
    inputs:
      ec2_host:
        description: Live SIP/media EC2 host
        required: true
        default: 43.210.122.111
      since_minutes:
        description: Minutes of logs to collect
        required: true
        default: "120"
      extension:
        description: SIP extension used by the test phone
        required: true
        default: "1001"
      destination:
        description: PSTN number dialed during the test
        required: true
        default: "020303988"

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_USER: ubuntu
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  capture-target-call:
    name: Capture target Phone11 call evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Capture target call logs
        shell: bash
        run: |
          set -Eeuo pipefail

          EC2_HOST="${{ github.event.inputs.ec2_host || '43.210.122.111' }}"
          SINCE_MINUTES="${{ github.event.inputs.since_minutes || '120' }}"
          EXTENSION="${{ github.event.inputs.extension || '1001' }}"
          DESTINATION="${{ github.event.inputs.destination || '020303988' }}"
          LOG_DIR="$RUNNER_TEMP/phone11-target-call-logs"
          LOG_FILE="$LOG_DIR/phone11-target-call-logs.txt"
          mkdir -p "$LOG_DIR"

          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo 'ERROR: AWS credentials are not configured.'
            exit 30
          fi

          echo '=== Locate EC2 instance ==='
          INSTANCE_JSON=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=$EC2_HOST" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0]' \
            --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = 'null' ]; then
            echo "ERROR: Could not find running EC2 instance for $EC2_HOST"
            exit 32
          fi
          echo "Found EC2 instance $INSTANCE_ID in $AZ"

          echo '=== Prepare temporary SSH access ==='
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/phone11_target_call_key -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$INSTANCE_ID" \
            --availability-zone "$AZ" \
            --instance-os-user "$EC2_USER" \
            --ssh-public-key "file://$HOME/.ssh/phone11_target_call_key.pub"

          echo '=== Capture target call evidence ==='
          ssh -i ~/.ssh/phone11_target_call_key \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=6 \
            "$EC2_USER@$EC2_HOST" \
            "SINCE_MINUTES='$SINCE_MINUTES' EXTENSION='$EXTENSION' DESTINATION='$DESTINATION' bash -s" <<'REMOTE' | tee "$LOG_FILE"
          set -Eeuo pipefail

          redact() {
            sed -E \
              -e 's#(Authorization: Bearer )[A-Za-z0-9._~+/=-]+#\1<redacted>#g' \
              -e 's#(AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|AWS_SESSION_TOKEN|PGPASSWORD|DB_PASSWORD|POSTGRES_PASSWORD|JWT_SECRET|SIP_PASSWORD|PASSWORD|SECRET|TOKEN)=([^[:space:]]+)#\1=<redacted>#Ig' \
              -e 's#(password|passwd|pwd|secret|token|authorization)([=:][[:space:]]*)[^[:space:],;]+#\1\2<redacted>#Ig' \
              -e 's#(postgres(ql)?://[^:[:space:]]+):[^@[:space:]]+@#\1:<redacted>@#Ig'
          }
          section() { printf '\n===== %s =====\n' "$1"; }
          esc() { printf '%s' "$1" | sed -E 's/[][(){}.^$*+?|\\]/\\&/g'; }

          EXT_RE="$(esc "$EXTENSION")"
          DEST_RE="$(esc "$DESTINATION")"
          STRICT_TARGET_RE="${EXT_RE}|${DEST_RE}|sip:${EXT_RE}@|from=<sip:${EXT_RE}|From:.*${EXT_RE}|To:.*${DEST_RE}|ruri=.*${DEST_RE}|R-URI.*${DEST_RE}|INVITE sip:${DEST_RE}"
          MEDIA_RE="RTPENGINE_|FORCED_PUBLIC_NATIVE_ANSWER_SDP|BEFORE_ANSWER|AFTER_ANSWER|c=IN IP4|m=audio|ACK|200 OK|ERROR|failure|t_forward_nonack"

          section "target capture metadata"
          echo "time_utc=$(date -u -Iseconds)"
          echo "since_minutes=${SINCE_MINUTES}"
          echo "extension=${EXTENSION}"
          echo "destination=${DESTINATION}"

          section "containers"
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' | redact || true

          for name in p11-kamailio p11-freeswitch p11-rtpengine cp11-backend; do
            section "strict target docker logs: $name"
            if docker ps --format '{{.Names}}' | grep -qx "$name"; then
              tmp="/tmp/${name}.target.log"
              docker logs --since "${SINCE_MINUTES}m" --timestamps "$name" 2>&1 | grep -Eia "$STRICT_TARGET_RE" > "$tmp" || true
              hits=$(wc -l < "$tmp" | tr -d ' ')
              echo "strict_target_hit_count=$hits"
              if [ "$hits" != "0" ]; then
                tail -n 260 "$tmp" | redact
              else
                echo "NO_STRICT_TARGET_LINES_FOUND"
              fi
            else
              echo "MISSING_CONTAINER"
            fi
          done

          section "kamailio media and signaling alerts"
          if docker ps --format '{{.Names}}' | grep -qx p11-kamailio; then
            tmp=/tmp/kamailio.media.log
            docker logs --since "${SINCE_MINUTES}m" --timestamps p11-kamailio 2>&1 | grep -Eia "$MEDIA_RE" > "$tmp" || true
            echo "media_alert_count=$(wc -l < "$tmp" | tr -d ' ')"
            tail -n 260 "$tmp" | redact || true
          fi

          section "freeswitch current calls and channels"
          if docker ps --format '{{.Names}}' | grep -qx p11-freeswitch; then
            docker exec p11-freeswitch sh -lc 'if command -v fs_cli >/dev/null 2>&1; then fs_cli -x "show calls"; fs_cli -x "show channels"; fs_cli -x "show detailed_calls" || true; else echo fs_cli-not-found; fi' 2>&1 | redact || true
          fi

          section "freeswitch recent CDR/log target search"
          if docker ps --format '{{.Names}}' | grep -qx p11-freeswitch; then
            docker exec p11-freeswitch sh -lc '
              for root in /var/log/freeswitch /usr/local/freeswitch/log /opt/freeswitch/log; do
                [ -d "$root" ] || continue
                echo "-- root=$root --"
                find "$root" -type f -mmin -"${SINCE_MINUTES}" 2>/dev/null | while read -r file; do
                  if grep -Eia "${EXTENSION}|${DESTINATION}" "$file" >/dev/null 2>&1; then
                    echo "--- $file ---"
                    grep -Eia "${EXTENSION}|${DESTINATION}|codec|rtp|audio|bridge|hangup|answer|CHANNEL_" "$file" | tail -n 120
                  fi
                done
              done
            ' 2>&1 | redact || true
          fi

          section "rtpengine sockets snapshot"
          if docker ps --format '{{.Names}}' | grep -qx p11-rtpengine; then
            docker exec p11-rtpengine sh -lc 'if command -v ss >/dev/null 2>&1; then ss -lunp | grep -E ":(2[0-9]{4}|30000)" | tail -n 80 || true; else cat /proc/net/udp | tail -n 80; fi' 2>&1 | redact || true
          fi

          section "capture complete"
          echo "time_utc=$(date -u -Iseconds)"
          REMOTE

      - name: Upload target call log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone11-target-call-logs
          path: ${{ runner.temp }}/phone11-target-call-logs/phone11-target-call-logs.txt
          if-no-files-found: warn

name: Phone11 owned auth iOS build

on:
  push:
    branches: [codex/phone11-owned-auth-20260909]
    paths: [.github/workflows/phone11-owned-auth-ios-build.yml, eas.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone11-owned-auth-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - name: Install locked source dependencies
        run: pnpm install --frozen-lockfile
      - name: Test mobile authentication and SIP isolation
        run: |
          node -e 'const p=require("./eas.json").build["preview-ios-existing-credentials"];if(p.ios.image!=="macos-sequoia-15.6-xcode-26.0")throw new Error("Unexpected iOS build image");'
          node -e 'const p=require("./package.json");if(p.dependencies["expo-asset"]!=="12.0.11")throw new Error("Required native audio peer missing");const r=JSON.parse(require("child_process").execFileSync("pnpm",["exec","expo-modules-autolinking","resolve","--platform","apple","--json"],{encoding:"utf8"}));if(!r.modules.some(m=>m.packageName==="expo-asset"&&m.modules.includes("AssetModule")))throw new Error("ExpoAsset is not linked");console.log("ExpoAsset native module resolved");'
          pnpm run test:auth-client
          pnpm run test:auth-sip
      - uses: expo/expo-github-action@v8
        with:
          eas-version: "23.2.0"
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm
      - name: Verify EAS access
        run: eas whoami
      - name: Build signed internal iOS app using existing credentials
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          eas build --platform ios --profile preview-ios-existing-credentials --non-interactive --wait --json > "$RUNNER_TEMP/phone11-build.json"
          node -e 'const fs=require("fs");const builds=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/phone11-build.json","utf8"));for(const b of builds){console.log(JSON.stringify({id:b.id,status:b.status,gitCommitHash:b.gitCommitHash,buildUrl:b.artifacts?.buildUrl}));if(b.status!=="FINISHED"||b.gitCommitHash!==process.env.GITHUB_SHA)process.exitCode=1;}'

name: Phone11 live iPhone REGISTER capture v52

on:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - .github/workflows/phone11-live-register-capture-v52.yml
      - .github/scripts/phone11-live-register-capture-v52.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_USER: ubuntu
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  EC2_HOST: 43.210.122.111

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/phone11-mobile-pjsip-20260506
      - name: Capture live iPhone REGISTER attempt
        shell: bash
        run: bash .github/scripts/phone11-live-register-capture-v52.sh

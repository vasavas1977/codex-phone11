name: Phone11 Mobile Native Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "modules/phone11-siprix/**"
      - "scripts/**"
      - "docs/**"
      - "app.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "eas.json"
      - ".github/workflows/phone11-mobile-cloud-check.yml"
      - ".github/workflows/phone11-eas-android-dev-client.yml"
      - ".github/workflows/phone11-eas-ios-dev-client.yml"

permissions:
  contents: read

jobs:
  install-test-config:
    name: Install, test, and validate Expo config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Validate Expo config
        run: pnpm exec expo config --type public

  native-dev-client-prebuild:
    name: Validate native dev-client prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm native dev-client dependencies
        run: pnpm list expo-dev-client react-native-callkeep @config-plugins/react-native-callkeep --depth 0

      - name: Validate Expo config
        run: pnpm exec expo config --type public

      - name: Prebuild native projects without installing pods/gradle deps
        run: pnpm exec expo prebuild --clean --no-install

  android-gradle-assemble:
    name: Compile Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        run: pnpm exec expo prebuild --clean --platform android --no-install

      - name: Compile Android debug build
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

  siprix-bridge-regressions:
    name: Compile and test the iOS Siprix bridge
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - name: Install locked native headers
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check pinned headers and actual bridge callbacks
        run: |
          test -f modules/phone11-siprix/tests/native-runtime.test.mjs
          test -f modules/phone11-siprix/tests/native-runtime.m
          test -f modules/phone11-siprix/tests/native-warm-runtime.test.mjs
          test -f modules/phone11-siprix/tests/native-warm-runtime.m
          test "$(uname -s)" = Darwin
          xcrun --find clang
          node scripts/stage-siprix-sdk.mjs
          node --test --test-reporter=tap modules/phone11-siprix/tests/*.test.mjs | tee "$RUNNER_TEMP/phone11-native-results.tap"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          output = (Path(os.environ["RUNNER_TEMP"]) / "phone11-native-results.tap").read_text()
          for key, expected in [("fail", 0), ("skipped", 0), ("cancelled", 0), ("todo", 0)]:
              assert re.search(rf"^# {key} {expected}$", output, re.M), f"Native {key} gate failed"
          count = re.search(r"^# tests (\d+)$", output, re.M)
          assert count and int(count[1]) > 0, "Native tests did not execute"
          required = ["all native selectors and delegate methods compile against the exact staged SDK header",
                      "actual bridge lifecycle, callback, security, and call-control behavior with a mock SDK",
                      "default-off native warm-transfer candidate uses pinned selectors and owned async lifecycle"]
          for name in required:
              assert re.search(rf"^ok \d+ - {re.escape(name)}$", output, re.M), f"Required native case did not execute: {name}"
          print("Native bridge and warm-transfer source gates executed with zero skips")
          PY

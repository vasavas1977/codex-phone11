permissions:
  contents: read

jobs:
  app-and-service-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - name: Install locked source dependencies
        run: pnpm install --frozen-lockfile
      - name: Test phone readiness, actual call entry, controls, and directory
        run: |
          pnpm exec vitest run \
            tests/phone11-registration-lifecycle.test.ts \
            tests/phone11-call-entry.test.tsx \
            tests/phone11-active-controls.test.tsx \
            tests/phone11-incoming-controls.test.tsx \
            tests/phone11-in-app-answer.test.tsx \
            tests/phone11-current-call-banner.test.tsx \
            tests/phone11-active-call-navigation.test.tsx \
            tests/phone11-active-call-recording.test.tsx \
            tests/phone11-diagnostics-persistence.test.ts \
            tests/phone11-recents-ui.test.tsx \
            tests/phone11-call-actions.test.tsx \
            tests/phone11-call-action-state.test.ts \
            tests/phone11-hidden-calls.test.tsx \
            tests/phone11-call-history.test.ts \
            tests/phone11-phone-number.test.ts \
            tests/device-contacts.test.ts \
            tests/device-contacts-hook.test.ts \
            tests/phone11-directory.test.ts \
            tests/phone11-directory-ui.test.tsx
      - name: Require fresh PBX read authority after cache invalidation races
        run: |
          test -f tests/phone11-pbx-admin-read-revocation.test.ts
          pnpm exec vitest run tests/phone11-pbx-admin-read-revocation.test.ts --reporter=json --outputFile=/tmp/phone11-pbx-read-authority.json
          python3 - <<'PYREAD'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/phone11-pbx-read-authority.json').read_text())
          matches = [suite for suite in report['testResults'] if Path(suite['name']).resolve() == Path('tests/phone11-pbx-admin-read-revocation.test.ts').resolve()]
          assert len(matches) == 1 and matches[0]['assertionResults'], 'Required PBX read-authority suite must run'
          assert all(case['status'] == 'passed' for case in matches[0]['assertionResults']), 'PBX read-authority cases must pass without skips'
          PYREAD
      - name: Test media, push, PBX authorization, and durable chat state

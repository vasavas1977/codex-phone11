          for suite in \
            tests/phone11-admin-member-confirmation.test.tsx \
            tests/phone11-admin-invitations-lifecycle.test.tsx \
            tests/phone11-admin-members-ui.test.ts \
            lib/meetings/prejoin-owner-session.test.tsx \
            tests/phone11-conference-auth-race.test.tsx \
            lib/meetings/media-ownership.test.ts \
            lib/meetings/route-exit.test.ts \
            tests/phone11-voicemail-readiness.test.ts \
            tests/phone11-voicemail-producer-durability.test.ts \
            tests/phone11-transfer-lifecycle.test.tsx \
            tests/phone11-voicemail-callback.test.tsx \
            server/meetings/meeting-host-removal-router.test.ts \
            server/meetings/meeting-host-removal-lifetime.test.ts \
            server/meetings/meeting-host-control-snapshot.test.ts \
            lib/meetings/member-removal.test.ts \
            lib/meetings/member-removal-panel.test.tsx; do
            test -f "$suite" || { echo "Required suite missing: $suite" >&2; exit 1; }
          done
          pnpm exec vitest run \
            tests/phone11-media-security.test.ts \
            tests/phone11-recording-gemini.test.ts \
            tests/phone11-recording-worker.test.ts \
            tests/phone11-recording-capture.test.ts \
            tests/phone11-recording-esl.test.ts \
            tests/phone11-recording-spool.test.ts \
            tests/phone11-recording-ledger.test.ts \
            tests/phone11-recording-service.test.ts \
            tests/phone11-recording-channel-dump.test.ts \
            tests/phone11-recording-correlation.test.ts \
            tests/phone11-cloud-playback.test.ts \
            tests/phone11-cloud-playback-focus.test.tsx \
            tests/phone11-playback-controls.test.tsx \
            tests/phone11-playback-output-picker.test.tsx \
            tests/phone11-playback-output-picker-native.test.tsx \
            tests/phone11-playback-controller.test.ts \
            tests/phone11-playback-route.test.ts \
            tests/phone11-summary-actions.test.ts \
            tests/phone11-summary-actions-ui.test.tsx \
            tests/phone11-summary-tools-auth.test.ts \
            tests/phone11-summary-translation.test.ts \
            tests/phone11-recording-personal-metadata.test.ts \
            tests/phone11-recording-speaker-names.test.ts \
            tests/phone11-speaker-names-editor.test.tsx \
            tests/phone11-cloud-polling.test.ts \
            tests/phone11-cloud-recording-ui.test.tsx \
            tests/phone11-cloud-recording-auth.test.ts \

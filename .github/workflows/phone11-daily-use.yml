            tests/phone11-push-security.test.ts \
            tests/phone11-push-session.test.ts \
            tests/phone11-voip-token.test.ts \
            tests/phone11-voip-client.test.ts \
            tests/phone11-apns.test.ts \
            tests/phone11-push-delivery.test.ts \
            tests/phone11-pbx-integration-security.test.ts \
            tests/phone11-chat-state.test.ts \
            tests/phone11-chat-controls.test.tsx \
            tests/phone11-chat-mentions.test.ts \
            tests/phone11-chat-mention-picker.test.tsx \
            tests/phone11-chat-all-mentions.test.ts \
            tests/phone11-profile-menu.test.tsx \
            tests/phone11-profile-scope.test.tsx \
            tests/phone11-admin-member-confirmation.test.tsx \
            tests/phone11-admin-invitations-lifecycle.test.tsx \
            tests/phone11-admin-members-ui.test.ts \
            server/profile/service.test.ts \
            lib/meetings/native-session.test.ts \
            lib/meetings/room-construction-diagnostic.test.ts \
            lib/meetings/browser-session.test.ts \
            lib/meetings/prejoin-owner-session.test.tsx \
            tests/phone11-conference-auth-race.test.tsx \
            lib/meetings/media-ownership.test.ts \
            lib/meetings/route-exit.test.ts \
            tests/phone11-meeting-prejoin.test.tsx \
            tests/phone11-graceful-shutdown.test.ts \
            tests/phone11-chat-persistence.test.ts \
            tests/phone11-chat-scope-ui.test.tsx \
            tests/phone11-chat-transport.test.ts \
            tests/phone11-chat-owner.test.ts \
            tests/phone11-rich-presence.test.tsx \
            tests/phone11-chat-typing.test.ts \
            tests/phone11-chat-read-receipts.test.ts \
            tests/phone11-chat-read-receipt-sheet.test.tsx \
            tests/phone11-runtime-role.test.ts \
            tests/phone11-api-candidate-startup.test.ts \
            tests/phone11-chat-foreground.test.ts \
            tests/phone11-legacy-unavailable.test.tsx \
            tests/phone11-chat-notification-client.test.ts \
            tests/phone11-enrollment-recovery.test.ts \
            tests/phone11-chat-notification-component.test.ts \
            tests/phone11-chat-notification-prompt.test.tsx \
            tests/phone11-chat-notification-server.test.ts \
            tests/phone11-chat-notification-settings.test.tsx \
            tests/phone11-chat-notification-apns.test.ts \
            tests/phone11-wake-client.test.ts \
            tests/phone11-wake-refresh.test.ts \
            tests/phone11-voip-enrollment-lifecycle.test.ts \
            tests/phone11-wake-service.test.ts \
            tests/phone11-wake-routes.test.ts
          node --test tests/phone11-wake-plugin.test.mjs tests/phone11-wake-kamailio.test.mjs
      - name: Test transfer and voicemail consumer lifecycle
        run: |
          pnpm exec vitest run \
            tests/phone11-siprix-engine.test.ts \
            tests/phone11-active-call-navigation.test.tsx \
            tests/phone11-current-call-banner.test.tsx \
            tests/phone11-transfer-lifecycle.test.tsx \
            tests/phone11-transfer-screen.test.tsx \
            tests/phone11-voicemail-callback.test.tsx \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/phone11-transfer-results.json"
      # Host removal remains default-off. This job exercises the
      # source contract only; the separate PG17 job exercises durable authority.
      - name: Test host removal authority service and provider receipt contract
        run: |
          pnpm exec vitest run \
            server/meetings/meeting-host-removal-router.test.ts \
            server/meetings/meeting-host-removal-lifetime.test.ts \
            server/meetings/meeting-host-control-snapshot.test.ts \
            lib/meetings/member-removal.test.ts \
            lib/meetings/member-removal-panel.test.tsx \
            server/meetings/meeting-host-eviction-service.test.ts \
            server/meetings/meeting-host-eviction-transport.test.ts \
            server/meetings/plain-video-eviction-service.test.ts \
            server/meetings/plain-video-eviction-repository.test.ts \
            server/meetings/connect11-plain-video-facade.test.ts
      - name: Test guarded voicemail routing and durable producer lifecycle
        run: |
          pnpm exec vitest run \
            tests/phone11-voicemail-dialplan.test.ts \
            tests/phone11-voicemail-dialplan-route.test.ts \
            tests/phone11-voicemail-fallbacks.test.ts \
            tests/phone11-voicemail-static-routing.test.ts \
            tests/phone11-voicemail-helper-preflight.test.ts \
            tests/phone11-ring-group-dialplan.test.ts \
            tests/phone11-queue-dialplan.test.ts \
            tests/phone11-voicemail-durability.test.ts \
            tests/phone11-voicemail-readiness.test.ts \
            tests/phone11-voicemail-producer.test.ts \
            tests/phone11-voicemail-producer-durability.test.ts \
            tests/phone11-voicemail-lifecycle-rehearsal.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/phone11-voicemail-results.json"
      - name: Test browser sharing and Android Answer media recovery
        run: |
          for suite in lib/meetings/browser-screen-share.test.ts lib/meetings/web-session.test.ts tests/phone11-meeting-screen-share-ui.test.tsx tests/phone11-android-call-permission.test.ts tests/phone11-android-answer-media.test.ts; do
            test -f "$suite" || { echo "Required suite missing: $suite" >&2; exit 1; }
          done
          pnpm exec vitest run \
            lib/meetings/browser-screen-share.test.ts \
            lib/meetings/web-session.test.ts \
            tests/phone11-meeting-screen-share-ui.test.tsx \
            tests/phone11-android-call-permission.test.ts \
            tests/phone11-android-answer-media.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/phone11-interactive-media-results.json"
      - name: Require executed completion regressions with zero skips
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          required = {
              "phone11-transfer-results.json": ["tests/phone11-siprix-engine.test.ts", "tests/phone11-active-call-navigation.test.tsx", "tests/phone11-current-call-banner.test.tsx", "tests/phone11-transfer-lifecycle.test.tsx", "tests/phone11-transfer-screen.test.tsx", "tests/phone11-voicemail-callback.test.tsx"],
              "phone11-voicemail-results.json": ["tests/phone11-voicemail-producer-durability.test.ts", "tests/phone11-voicemail-producer.test.ts", "tests/phone11-voicemail-lifecycle-rehearsal.test.ts", "tests/phone11-voicemail-helper-preflight.test.ts"],
              "phone11-interactive-media-results.json": ["lib/meetings/browser-screen-share.test.ts", "lib/meetings/web-session.test.ts", "tests/phone11-meeting-screen-share-ui.test.tsx", "tests/phone11-android-call-permission.test.ts", "tests/phone11-android-answer-media.test.ts"],
          }
          for report_name, suites in required.items():
              report = json.loads((Path(os.environ["RUNNER_TEMP"]) / report_name).read_text())
              assert report["success"] is True, report_name
              for suite in suites:
                  matches = [result for result in report["testResults"] if Path(result["name"]).resolve() == Path(suite).resolve()]
                  assert len(matches) == 1, f"Required suite missing or duplicated: {suite}"
                  assertions = matches[0]["assertionResults"]
                  assert assertions and all(case["status"] == "passed" for case in assertions), f"Required suite has unexecuted or failed cases: {suite}"
                  print(f"{suite}: {len(assertions)} passed, zero skips")
          PY
      - name: Install Lua source test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4
      - name: Test voicemail admission mode agreement and legacy route guards
        run: |
          lua5.4 tests/phone11-voicemail-hook.lua
          lua5.4 tests/phone11-legacy-voicemail-hook.lua
          lua5.4 tests/phone11-did-voicemail-hook.lua
      - name: Parse disabled and enabled wake candidates with exact Kamailio version
        run: node ops/scripts/check-phone11-wake-kamailio.mjs --image ghcr.io/kamailio/kamailio-ci@sha256:8eebac744905d360d04bd871ee46a3de0908aa30989649c00fd590914cb35fa0
      - name: Test held INVITE, cancellation and timeout with isolated SIP endpoints
        run: node ops/scripts/test-phone11-wake-kamailio.mjs
      - name: Test isolated recording anchor routing and FreeSWITCH guards
        run: |
          docker build -t phone11-recording-anchor-test tests/fixtures/phone11-recording-anchor
          docker run --rm --network none -v "$PWD:/work:ro" phone11-recording-anchor-test \
            python3 tests/fixtures/phone11-recording-anchor/run.py
          docker run --rm --network none -v "$PWD:/work:ro" phone11-recording-anchor-test \
            python3 tests/fixtures/phone11-recording-anchor/xml-check.py
          docker run --rm --network none -v "$PWD:/work:ro" phone11-recording-anchor-test \
            python3 tests/fixtures/phone11-outbound-recording/run.py
      - name: Verify outgoing recording metadata with actual FreeSWITCH and isolated SIP endpoints
        run: |
          docker pull safarov/freeswitch@sha256:b31c743f4c911a19687c61e3214968f2a24f93f9d3d667cc26284192e158ffc6
          sudo env PHONE11_FREESWITCH_IMAGE=safarov/freeswitch@sha256:b31c743f4c911a19687c61e3214968f2a24f93f9d3d667cc26284192e158ffc6 \
            bash tests/fixtures/phone11-outbound-recording-fs/run.sh
      - name: Compile backend with esbuild
        run: pnpm run build:backend
      # Source tests and cross-platform JS compilation only. Native helper and
      # signed distribution acceptance remain separate macOS/Windows gates.
      - name: Test and compile the isolated desktop app
        run: |
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm --prefix desktop/app ci --no-audit --no-fund
          node --import tsx --test desktop/tests/*.node.ts
          npm --prefix desktop/app test
          npm --prefix desktop/app run typecheck
          PHONE11_BUILD_PLATFORM=darwin npm --prefix desktop/app run build

  routing-authority-postgres-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: p11_routing_auth_fixture
          POSTGRES_PASSWORD: p11-routing-fixture-ci-only
          POSTGRES_DB: phone11_routing_auth_test
        ports:
          - "127.0.0.1:55443:5432"
        options: >-
          --health-cmd "pg_isready -U p11_routing_auth_fixture -d phone11_routing_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Synthetic dedicated job service. No deployment URL or ambient PG fallback.
      PHONE11_ROUTING_AUTH_REQUIRE_POSTGRES: "1"
      PHONE11_ROUTING_AUTH_TEST_DATABASE_URL: postgres://p11_routing_auth_runtime:p11-routing-runtime-ci-only@127.0.0.1:55443/phone11_routing_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - name: Install locked source dependencies
        run: pnpm install --frozen-lockfile
      - name: Admit and initialize only the disposable routing authority service
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import pg from 'pg';
          const id = process.env.PG_CONTAINER_ID;
          assert.match(id ?? '', /^[a-f0-9]{64}$/);
          for (const key of ['PGHOST','PGPORT','PGDATABASE','PGUSER','PGPASSWORD','PGSSLMODE','PGSERVICE','PGSERVICEFILE']) {
            assert.equal(process.env[key], undefined, 'Unexpected PostgreSQL fallback: ' + key);
          }
          assert.equal(process.env.PHONE11_ROUTING_AUTH_REQUIRE_POSTGRES, '1');
          const [container] = JSON.parse(execFileSync('docker', ['inspect', id], { encoding: 'utf8' }));
          assert.equal(container.Id, id);
          assert.equal(container.State.Running, true);
          assert.equal(container.Config.Image, 'postgres:17-bookworm');
          const env = new Map(container.Config.Env.map(value => {
            const at = value.indexOf('='); return [value.slice(0, at), value.slice(at + 1)];
          }));
          assert.equal(env.get('POSTGRES_USER'), 'p11_routing_auth_fixture');
          assert.equal(env.get('POSTGRES_DB'), 'phone11_routing_auth_test');
          assert.equal(env.get('POSTGRES_PASSWORD'), 'p11-routing-fixture-ci-only');
          assert.deepEqual(container.NetworkSettings.Ports['5432/tcp'], [{ HostIp: '127.0.0.1', HostPort: '55443' }]);
          const url = new URL(process.env.PHONE11_ROUTING_AUTH_TEST_DATABASE_URL);
          assert.equal(url.protocol, 'postgres:');
          assert.equal(url.hostname, '127.0.0.1');
          assert.equal(url.port, '55443');
          assert.equal(url.pathname, '/phone11_routing_auth_test');
          assert.equal(url.username, 'p11_routing_auth_runtime');
          assert.equal(url.password, 'p11-routing-runtime-ci-only');
          assert.equal(url.search, '');
          assert.equal(url.hash, '');
          const client = new pg.Client({
            host: '127.0.0.1', port: 55443, database: 'phone11_routing_auth_test',
            user: 'p11_routing_auth_fixture', password: 'p11-routing-fixture-ci-only',
            ssl: false, connectionTimeoutMillis: 3000, query_timeout: 10000,
          });
          try {
            await client.connect();
            const { rows: [identity] } = await client.query(
              "SELECT current_database() db,current_user role,current_setting('server_version_num') version");
            assert.equal(identity.db, 'phone11_routing_auth_test');
            assert.equal(identity.role, 'p11_routing_auth_fixture');
            assert.ok(Number(identity.version) >= 170000 && Number(identity.version) < 180000);
            await client.query(`
              CREATE SCHEMA p11_routing_auth_test;
              SET search_path=p11_routing_auth_test,pg_catalog;
              CREATE TABLE tenants(id integer PRIMARY KEY,status text NOT NULL);
              CREATE TABLE tenant_memberships(
                user_id integer,tenant_id integer REFERENCES tenants(id),role text,status text,
                created_at timestamptz,PRIMARY KEY(user_id,tenant_id));
              CREATE TABLE extensions(
                id integer PRIMARY KEY,tenant_id integer NOT NULL REFERENCES tenants(id),deleted_at timestamptz);
              SET phone11.expected_database='phone11_routing_auth_test';
              SET phone11.expected_schema='p11_routing_auth_test';
            `);
            // The migration owns BEGIN/COMMIT; this connection has no caller transaction.
            await client.query(readFileSync('server/pbx/advanced-routing-migration.sql', 'utf8'));
            await client.query(`
              CREATE ROLE p11_routing_auth_runtime LOGIN PASSWORD 'p11-routing-runtime-ci-only'
                NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;
              GRANT CONNECT ON DATABASE phone11_routing_auth_test TO p11_routing_auth_runtime;
              GRANT USAGE ON SCHEMA p11_routing_auth_test TO p11_routing_auth_runtime;
              GRANT SELECT,INSERT,UPDATE,DELETE ON ALL TABLES IN SCHEMA p11_routing_auth_test TO p11_routing_auth_runtime;
              GRANT USAGE,SELECT ON ALL SEQUENCES IN SCHEMA p11_routing_auth_test TO p11_routing_auth_runtime;
            `);
          } finally {
            await client.end();
          }
          JS
      - name: Require actual routing write and read authority checks
        # Both suites reset this fixture; keep separate invocations sequential.
        run: |
          pnpm exec vitest run tests/phone11-routing-write-authority.test.ts
          pnpm exec vitest run tests/phone11-routing-read-authority.test.ts


  legacy-provisioning-authority-postgres-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: p11_legacy_prov_owner
          POSTGRES_PASSWORD: p11-legacy-disposable-only-c9
          POSTGRES_DB: phone11_legacy_prov_test
        ports:
          - "127.0.0.1:55444:5432"
        options: >-
          --health-cmd "pg_isready -U p11_legacy_prov_owner -d phone11_legacy_prov_test"

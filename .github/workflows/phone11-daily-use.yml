    branches: [codex/phone11-daily-use-20260910]
    paths:
      - "app.config.ts"
      - "plugins/**"
      - "infra/configs/kamailio/phone11-wake-candidate/**"
      - "infra/configs/kamailio/phone11-recording-anchor-candidate/**"
      - "infra/configs/freeswitch/phone11-recording-anchor-candidate/**"
      - "infra/configs/kamailio/phone11-outbound-recording-candidate/**"
      - "infra/configs/freeswitch/dialplan/public/02_kamailio_outbound.xml"
      - "infra/configs/freeswitch/**"
      - "infra/docker/freeswitch/**"
      - "infra/compose/docker-compose.*.yml"
      - "deploy/freeswitch/**"
      - "ops/scripts/check-phone11-wake-kamailio.mjs"
      - "ops/scripts/test-phone11-wake-kamailio.mjs"
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "server/**"
      - "desktop/**"

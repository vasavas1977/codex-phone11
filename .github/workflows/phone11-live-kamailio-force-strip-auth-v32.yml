name: Phone11 live Kamailio force strip auth v32

on:
  workflow_dispatch:
  push:
    branches:
      - codex/phone11-mobile-pjsip-20260506
    paths:
      - ".github/workflows/phone11-live-kamailio-force-strip-auth-v32.yml"

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-southeast-7' }}
  EC2_USER: ubuntu
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  EC2_HOST: 43.210.122.111

jobs:
  kamailio-force-strip-auth-v32:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate EC2 and prepare temporary SSH key
        shell: bash
        run: |
          set -Eeuo pipefail
          INSTANCE_JSON=$(aws ec2 describe-instances --filters "Name=ip-address,Values=$EC2_HOST" "Name=instance-state-name,Values=running" --query 'Reservations[0].Instances[0]' --output json)
          INSTANCE_ID=$(echo "$INSTANCE_JSON" | jq -r '.InstanceId // empty')
          AZ=$(echo "$INSTANCE_JSON" | jq -r '.Placement.AvailabilityZone // empty')
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "null" ]; then echo "ERROR: EC2 not found"; exit 31; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/phone11_kam_force_strip_v32_key -C phone11-github-actions >/dev/null 2>&1
          aws ec2-instance-connect send-ssh-public-key --instance-id "$INSTANCE_ID" --availability-zone "$AZ" --instance-os-user "$EC2_USER" --ssh-public-key "file://$HOME/.ssh/phone11_kam_force_strip_v32_key.pub" >/dev/null

      - name: Patch live Kamailio without forwarding stale auth
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/phone11_kam_force_strip_v32_key -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

          docker cp p11-kamailio:/etc/kamailio/kamailio.cfg /tmp/kamailio.cfg.v32
          cp /tmp/kamailio.cfg.v32 /tmp/kamailio.cfg.v32.before

          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/kamailio.cfg.v32")
          text = path.read_text()

          if 'loadmodule "textopsx.so"' not in text:
              text = text.replace(
                  'loadmodule "textops.so"\n',
                  'loadmodule "textops.so"\nloadmodule "textopsx.so"\n',
                  1,
              )

          marker = "phone11-strip-fs-auth"
          block = (
              '    # phone11-strip-fs-auth: Kamailio already consumed caller auth; '
              'do not forward it to FreeSWITCH.\n'
              '    remove_hf("Proxy-Authorization");\n'
              '    remove_hf("Authorization");\n'
              '    msg_apply_changes();\n'
          )
          if marker not in text:
              candidates = [
                  '    $var(rtpe_rc) = rtpengine_offer',
                  '$var(rtpe_rc) = rtpengine_offer',
                  '    rtpengine_offer(',
                  'rtpengine_offer(',
              ]
              for candidate in candidates:
                  if candidate in text:
                      text = text.replace(candidate, block + candidate, 1)
                      break
              else:
                  raise SystemExit("V32_INSERT_TARGET_NOT_FOUND")

          path.write_text(text)
          PY

          docker cp /tmp/kamailio.cfg.v32 p11-kamailio:/etc/kamailio/kamailio.cfg

          echo "===== V32 live config proof ====="
          docker exec p11-kamailio sh -lc "grep -n 'textopsx\\|phone11-strip-fs-auth\\|remove_hf\\|msg_apply_changes\\|rtpengine_offer' /etc/kamailio/kamailio.cfg | sed -n '1,140p'"
          echo "===== V32 route context ====="
          docker exec p11-kamailio sh -lc "grep -n -A45 'route\\[TO_FREESWITCH\\]' /etc/kamailio/kamailio.cfg | sed -n '1,90p'"

          docker exec p11-kamailio kamailio -c -f /etc/kamailio/kamailio.cfg
          docker restart p11-kamailio
          sleep 5
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep p11-kamailio
          echo "V32_FORCE_STRIP_AUTH_PATCH_RESULT=pass"
          REMOTE

apply plugin: 'com.android.library'

// Source compiler gate: include this project manually, without autolinking it.
// Actual APK activation requires a separate host runtime AAR dependency and review.
def sdkAar = file(findProperty('phone11SiprixAndroidAar') ?: System.getenv('PHONE11_SIPRIX_ANDROID_AAR') ?: '../vendor/android/siprix_voip_sdk.aar')
def expectedSha = '3173ee8bae7aa37d3be3b44f7533d43b4e4d8625110d1d2bd8d79367973c9198'
def expectedApiSha = '4929fc4b157bb65b9739a8d872079975d369501c9b55ece7b4506a9c5ac6a1b0'
def sdkApiJar = layout.buildDirectory.file('phone11-siprix-api/classes.jar')
def sourceEnabled = findProperty('phone11AndroidForegroundSourceEnabled') == 'true'
def consultationEnabled = findProperty('phone11AndroidConsultationSourceEnabled') == 'true'
// Private generated native input only; never a Gradle property/BuildConfig field.
// Re-run on every compile so removing the environment value removes stale input.
def nativeLicenseDir = layout.buildDirectory.dir('phone11-native-license')
def generateNativeLicense = tasks.register('generatePhone11SiprixNativeLicense') {
  outputs.upToDateWhen { false }
  doLast {
    Process child = null
    try {
      // Gradle Exec debug logging can dump inherited environment values. Use a
      // direct child with both streams discarded and only a constant failure.
      child = new ProcessBuilder('python3', new File(projectDir, '../../../scripts/generate-phone11-native-license.py').canonicalPath,
        '--language', 'java', '--output', new File(nativeLicenseDir.get().asFile.canonicalFile, 'Phone11SiprixBuildLicense.java').path)
        .redirectOutput(ProcessBuilder.Redirect.DISCARD).redirectError(ProcessBuilder.Redirect.DISCARD).start()
      if (!child.waitFor(30, java.util.concurrent.TimeUnit.SECONDS) || child.exitValue() != 0)
        throw new GradleException('E_PHONE11_NATIVE_LICENSE_INPUT')
    } catch (Exception ignored) {
      throw new GradleException('E_PHONE11_NATIVE_LICENSE_INPUT')
    } finally {
      if (child != null && child.isAlive()) child.destroyForcibly()
    }
  }
}
if (consultationEnabled && !sourceEnabled) throw new GradleException('Android consultation source requires the explicit foreground source gate')
android {
  namespace 'ai.phone11.siprix'
  compileSdkVersion rootProject.ext.compileSdkVersion
  defaultConfig { minSdkVersion 24 }
  buildFeatures { buildConfig true }
  sourceSets.main.java.srcDir(nativeLicenseDir)
  defaultConfig {
    buildConfigField 'boolean', 'FOREGROUND_SOURCE_ENABLED', sourceEnabled.toString()
    buildConfigField 'boolean', 'CONSULTATION_SOURCE_ENABLED', consultationEnabled.toString()
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
def verifySdk = tasks.register('verifyPhone11SiprixAndroidSdk') {
  inputs.file(sdkAar)
  doLast {
    if (!sdkAar.isFile()) throw new GradleException('Phone11 Android source compile requires the pinned official Siprix AAR; set phone11SiprixAndroidAar or PHONE11_SIPRIX_ANDROID_AAR. No automatic download is performed.')
    def actual = java.security.MessageDigest.getInstance('SHA-256').digest(sdkAar.bytes).encodeHex().toString()
    if (actual != expectedSha) throw new GradleException('Phone11 Android Siprix AAR checksum mismatch')
  }
}
// Android compileOnly does not support AARs. Extract only the exact SDK API jar
// to temporary build output; native libraries and resources remain unpackaged.
def stageSdkApi = tasks.register('stagePhone11SiprixAndroidApi') {
  dependsOn verifySdk
  inputs.file(sdkAar)
  outputs.file(sdkApiJar)
  outputs.upToDateWhen { false }
  doLast {
    def archive = new java.util.zip.ZipFile(sdkAar)
    try {
      def entry = archive.getEntry('classes.jar')
      if (entry == null || entry.isDirectory()) throw new GradleException('Pinned Android Siprix API jar is missing')
      def bytes
      archive.getInputStream(entry).withCloseable { stream -> bytes = stream.bytes }
      def actual = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
      if (actual != expectedApiSha) throw new GradleException('Pinned Android Siprix API jar checksum mismatch')
      def output = sdkApiJar.get().asFile
      output.parentFile.mkdirs()
      output.bytes = bytes
    } finally { archive.close() }
  }
}
// compileOnly API jars prove compiler binding without creating an executable APK.
// Enabling source at compile time fails unless the host app includes the real AAR.
gradle.projectsEvaluated {
  if (sourceEnabled) {
    def host = rootProject.findProject(':app')
    def included = host?.configurations?.findByName('implementation')?.dependencies?.any { dependency ->
      dependency instanceof org.gradle.api.artifacts.FileCollectionDependency && dependency.files.files.any { it.canonicalFile == sdkAar.canonicalFile }
    }
    if (!included) throw new GradleException('Phone11 Android source activation requires :app implementation(files(pinnedSiprixAar)); compileOnly cannot supply the executable SIP runtime')
  }
}
tasks.matching { it.name.startsWith('compile') && it.name.endsWith('JavaWithJavac') }.configureEach { dependsOn stageSdkApi, generateNativeLicense }
dependencies {
  implementation 'com.facebook.react:react-android'
  compileOnly files(sdkApiJar).builtBy(stageSdkApi)
}

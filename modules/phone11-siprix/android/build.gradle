apply plugin: 'com.android.library'
android {
  namespace 'ai.phone11.siprix'
  compileSdkVersion rootProject.ext.compileSdkVersion
  defaultConfig { minSdkVersion 24 }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies {
  implementation 'com.facebook.react:react-android'
  // The provider adapter compiles without the Google Services Gradle plugin or
  // google-services.json; its manifest component remains disabled by default.
  implementation 'com.google.firebase:firebase-messaging:24.0.1'
  implementation 'host.exp.exponent:expo.modules.notifications:0.32.15'
  compileOnly files('../vendor/android/siprix_voip_sdk.aar')
}

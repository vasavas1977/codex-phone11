request_route {
    if (is_method("OPTIONS")) { sl_send_reply("200", "OK"); exit; }
    if (is_method("CANCEL")) {
        if (t_lookup_cancel("1") && isflagset(PHONE11_WAKE_FLAG)) { route(PHONE11_WAKE_CANCEL); }
        if (t_check_trans()) { route(RELAY); }
        exit;
    }
    if (is_method("REGISTER")) { save("location"); exit; }
    if (has_totag()) {
        if (is_known_dlg() && loose_route()) {
            if (is_method("BYE") && $dlg_var(phone11_wake) == "1") { route(PHONE11_WAKE_END); }
            route(RELAY);
        }
        exit;
    }
    if (is_method("INVITE")) {
        record_route(); dlg_manage(); route(PHONE11_WAKE_START); exit;
    }
    exit;
}
# Synthetic routing proof deliberately has no RTP/media commands or real endpoints.
route[PHONE11_INBOUND_OFFER] { return; }
route[RELAY] { if (!t_relay()) { sl_reply_error(); } exit; }
include_file "/candidate/routes.inc"

#!KAMAILIO
#!define WITH_PHONE11_OUTBOUND_RECORDING
#!define PHONE11_OUTBOUND_RECORDING_USER "3001"
#!define PHONE11_OUTBOUND_RECORDING_REALM "phone11.test"

listen=udp:127.0.0.1:5060
children=1

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "auth.so"

modparam("auth", "secret", "fixture-nonce-secret")
modparam("auth", "qop", "auth")
modparam("auth", "nonce_count", 1)

request_route {
    if (!is_method("INVITE")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    # Fixture-only path: invoke the production helper with unset AVPs to prove
    # its null guards fail closed. This path never relays a request.
    if (is_present_hf("X-Fixture-Test-Unset-Auth")) {
        route(PHONE11_OUTBOUND_RECORDING_IDENTITY);
        sl_send_reply("403", "Fixture Unset Auth Rejected");
        exit;
    }

    if (!pv_auth_check(PHONE11_OUTBOUND_RECORDING_REALM,
                       "fixture-password", "0", "0")) {
        proxy_challenge(PHONE11_OUTBOUND_RECORDING_REALM, "1");
        exit;
    }

    # The production call site stores only parser-verified digest identity.
    $avp(phone11_recording_auth_user) = $au;
    $avp(phone11_recording_auth_realm) = $ar;
    route(PHONE11_OUTBOUND_RECORDING_IDENTITY);
    consume_credentials();

    $du = "sip:127.0.0.1:5070";
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

include_file "/work/infra/configs/kamailio/phone11-outbound-recording-candidate/routes.inc"

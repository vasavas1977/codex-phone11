#!KAMAILIO
#!define WITH_PHONE11_RECORDING_ANCHOR
#!define PHONE11_ANCHOR_FS_IP "127.0.0.1"
#!define PHONE11_ANCHOR_FS_PORT 5080
#!define PHONE11_ANCHOR_CARRIER_IP "127.0.0.2"
#!define PHONE11_ANCHOR_DID "020303001"
#!define PHONE11_ANCHOR_FS_URI "sip:phone11-recording-3001@127.0.0.1:5080"
listen=udp:127.0.0.1:5060
children=1
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "pv.so"
loadmodule "rr.so"
loadmodule "dialog.so"
loadmodule "textops.so"
loadmodule "siputils.so"
request_route {
 if (is_method("CANCEL")) { if (t_check_trans()) { t_relay(); } exit; }
 if (has_totag()) {
  if (is_known_dlg() && loose_route()) { route(PHONE11_RECORDING_ANCHOR_DIALOG); }
  sl_send_reply("481", "Unknown dialog"); exit;
 }
 record_route();
 route(PHONE11_RECORDING_ANCHOR);
 sl_send_reply("404", "Existing route unchanged"); exit;
}
route[PHONE11_INBOUND_PILOT] {
 # Synthetic boundary: represents existing wake/lookup, preserves downstreamID.
 append_hf("X-Fixture-Wake-Flow: reached\r\n");
 $du="sip:3001@127.0.0.1:6001";
 if(!t_relay()){sl_reply_error();}
 exit;
}
include_file "/work/infra/configs/kamailio/phone11-recording-anchor-candidate/routes.inc"

#!KAMAILIO
#!define WITH_PHONE11_RECORDING_ANCHOR
#!define PHONE11_ANCHOR_FLAG 29
#!define PHONE11_ANCHOR_FS_IP "127.0.0.1"
#!define PHONE11_ANCHOR_FS_PORT 5080
#!define PHONE11_ANCHOR_FS_RETURN_PORT 5080
#!define PHONE11_ANCHOR_CARRIER_IP "127.0.0.2"
#!define PHONE11_ANCHOR_FS_URI "sip:phone11-recording-3001@127.0.0.1:5080"
listen=udp:127.0.0.1:5060
children=1
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "rtpengine.so"
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")
loadmodule "pv.so"
loadmodule "rr.so"
loadmodule "dialog.so"
loadmodule "textops.so"
loadmodule "siputils.so"
request_route {
 if (is_method("CANCEL")) { if(t_lookup_cancel("1")){route(PHONE11_RECORDING_ANCHOR_CANCEL);} if (t_check_trans()) { t_relay(); } exit; }
 if (has_totag()) {
  if (is_known_dlg() && loose_route()) { route(PHONE11_RECORDING_ANCHOR_DIALOG);
   if ($dlg_var(phone11_inbound_origin)=="freeswitch") {
    $avp(phone11_inbound_offer_leg)="phone";
    t_on_reply("PHONE11_INBOUND_REPLY"); t_relay(); exit;
   }
  }
  sl_send_reply("481", "Unknown dialog"); exit;
 }
 record_route();
 route(PHONE11_RECORDING_ANCHOR);
 sl_send_reply("404", "Existing route unchanged"); exit;
}
route[PHONE11_INBOUND_PILOT] {
 # Synthetic boundary: represents existing wake/lookup, preserves downstreamID.
 dlg_manage();
 $dlg_var(phone11_inbound_origin)="freeswitch";
 $avp(phone11_inbound_offer_leg)="origin";
 append_hf("X-Fixture-Wake-Flow: reached\r\n");
 $du="sip:3001@127.0.0.1:6001";
 t_on_reply("PHONE11_INBOUND_REPLY");
 if(!t_relay()){sl_reply_error();}
 exit;
}
onreply_route[PHONE11_INBOUND_REPLY] {
 if (t_check_status("[12][0-9][0-9]") && has_body("application/sdp")) {
  route(PHONE11_RECORDING_ANCHOR_INBOUND_REPLY);
 }
}
include_file "/work/infra/configs/kamailio/phone11-recording-anchor-candidate/routes.inc"

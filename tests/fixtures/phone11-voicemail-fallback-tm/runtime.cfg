#!KAMAILIO
# Disposable SIP/TM fixture only. No production routes or real accounts.
listen=udp:127.0.0.1:15060
children=2
debug=2
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "corex.so"
loadmodule "xlog.so"
loadmodule "jansson.so"
loadmodule "http_async_client.so"
modparam("http_async_client", "workers", 2)
modparam("http_async_client", "connection_timeout", 3000)

request_route {
    if (is_method("OPTIONS")) { sl_send_reply("200", "Ready"); exit; }
    if (is_method("CANCEL")) {
        if (t_lookup_cancel("1") && t_check_trans()) { t_relay(); }
        exit;
    }
    if (!is_method("INVITE") || has_totag() || $rU != "fixture") {
        sl_send_reply("404", "Fixture only"); exit;
    }
    if (!t_newtran()) { exit; }
    t_set_fr(700, 700);
    t_set_max_lifetime(1800, 1000);
    t_on_failure("VM_FINAL_FAILURE");
    # Both fork destinations are complete R-URIs. A global $du for the first
    # branch could also capture the appended branch and make the fork illusory.
    $du = $null;
    $ru = "sip:callee@127.0.0.1:15061";
    if (is_present_hf("X-Fixture-Fork")) {
        append_branch("sip:callee@127.0.0.1:15062");
    }
    if (!t_relay()) { t_reply("503", "Fixture relay failed"); }
    exit;
}

failure_route[VM_FINAL_FAILURE] {
    if ($avp(vm_selected) == 1 || $avp(vm_pending) == 1) { exit; }
    if (t_is_canceled() || t_is_expired() || !t_check_status("408")) { exit; }
    $avp(vm_pending) = 1;
    $http_req(all) = $null;
    $http_req(method) = "POST";
    $http_req(body) = $ci;
    $http_req(timeout) = 3000;
    # In a live transaction, http_async_query must suspend and resume THIS TM
    # transaction, including when invoked from failure_route.
    http_async_query("http://127.0.0.1:18080/authorize", "VM_AUTH_RESUME");
    exit;
}

route[VM_AUTH_RESUME] {
    if ($avp(vm_pending) != 1 || $avp(vm_selected) == 1 ||
        t_is_canceled() || t_is_expired()) { exit; }
    if (!$http_ok || $http_rs != 201 || $http_bs > 100 ||
        !jansson_get("reference", "$http_rb", "$var(vm_reference)") ||
        !($var(vm_reference) =~ "^[a-f0-9]{64}$")) {
        t_reply("480", "Fallback unavailable"); exit;
    }
    $avp(vm_selected) = 1;
    $ru = "sip:phone11-vm-" + $var(vm_reference) + "@127.0.0.1:15063";
    $du = "sip:voicemail@127.0.0.1:15063";
    if (!t_relay()) { t_reply("503", "Fixture fallback relay failed"); }
    exit;
}
